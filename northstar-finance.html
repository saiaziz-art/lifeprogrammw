/* =========================== CASH FLOW =========================== */
Views.cashflow = function(){
  const days = UI.state.cfDays;
  const cf = Calc.projectCashflow(days);
  const money0 = v => fmtMoney(v, null, { compact: true });

  let html = pageHead('Cash Flow',
    'Forward-looking projection of household cash (all checking, savings and cash accounts), driven by your scheduled items. Transfers between cash accounts are ignored — they stay inside the pool.',
    '<button class="btn btn-primary" data-action="sch.add">' + icon('plus', 14) + ' Add scheduled item</button>');

  html += '<div class="row mb12"><div class="seg seg-sm" role="group" aria-label="Projection range">' +
    [[30, 'Next 30 days'], [90, 'Next 90 days'], [365, 'Next 12 months']].map(([d, l]) =>
      '<button data-action="cf.range" data-d="' + d + '" aria-pressed="' + (days === d) + '">' + l + '</button>').join('') + '</div></div>';

  const lowLevel = cf.min.bal < 0 ? 'crit' : cf.min.bal < cf.minCash ? 'warn' : 'good';
  html += '<div class="kpis">';
  html += kpiHTML({ label: 'Cash today', value: fmtMoney(cf.start) });
  html += kpiHTML({
    label: 'Lowest projected point', value: '<span class="' + (lowLevel === 'good' ? '' : 'neg') + '">' + fmtMoney(cf.min.bal) + '</span>',
    note: fmtDate(cf.min.date, { short: true }) + ' · ' + relativeDay(cf.min.date)
  });
  html += kpiHTML({
    label: 'Safe discretionary cash', value: fmtMoney(cf.safe),
    info: 'The lowest projected balance minus your minimum cash floor (' + fmtMoney(cf.minCash) + '). Spending this much extra today should not breach the floor, if the schedule holds.'
  });
  html += kpiHTML({
    label: 'Cash floor', value: fmtMoney(cf.minCash),
    note: cf.warnings.length ? '<span class="warn-ink">' + cf.warnings.length + ' day' + (cf.warnings.length > 1 ? 's' : '') + ' below floor</span>' : 'No breaches projected',
    info: 'Set your minimum comfortable household cash balance in Settings.'
  });
  html += '</div>';

  const step = days <= 30 ? 1 : days <= 90 ? 1 : 2;
  const pts = cf.points.filter((p, i) => i % step === 0 || i === cf.points.length - 1);
  const labels = pts.map(p => fmtDate(p.date, { short: true }));
  html += Chart.card({
    title: 'Projected cash balance', sub: 'Dashed line marks your ' + fmtMoney(cf.minCash, null, { compact: true }) + ' floor',
    render: el => Chart.line(el, {
      labels,
      series: [{ name: 'Projected cash', color: '--s1', values: pts.map(p => p.bal) }],
      threshold: { value: cf.minCash, label: 'floor' },
      area: true, height: 220, yFmt: money0, yFmt2: v => fmtMoney(v), zero: cf.min.bal < cf.minCash * 1.5,
      tipExtra: i => pts[i].events.slice(0, 5).map(e => ({ label: e.name, value: fmtMoney(e.amt, null, { sign: true }) })),
      aria: 'Projected household cash balance'
    }),
    table: {
      head: ['Date', 'Balance', 'Movements'],
      rows: cf.points.filter(p => p.events.length).map(p => [fmtDate(p.date), fmtMoney(p.bal), p.events.map(e => e.name + ' ' + fmtMoney(e.amt, null, { sign: true })).join('; ')])
    }
  });

  if (cf.warnings.length){
    const first = cf.warnings[0];
    html += '<div class="warn-note mb12">' + icon('alert') + '<div><strong>Cash-flow pressure ahead.</strong> The balance first dips below your floor on ' +
      fmtDate(first.date) + ' (' + fmtMoney(first.bal) + '). Consider shifting a transfer, trimming a payment, or topping up from savings.</div></div>';
  }

  /* upcoming + manage */
  const upc = Calc.upcoming(days);
  html += '<div class="grid g2">';
  html += '<div class="card"><div class="card-head"><div class="card-title">Upcoming (' + upc.length + ')</div></div>' +
    (upc.length ? '<div style="max-height:420px;overflow-y:auto">' + upc.slice(0, 60).map(u => {
      const isIn = u.item.type === 'income', isTr = u.item.type === 'transfer';
      return '<div class="evt-row"><span class="dot" style="background:' + (isIn ? 'var(--s3)' : isTr ? 'var(--s7)' : 'var(--s2)') + '"></span>' +
        '<div class="evt-t"><div class="cell-main">' + esc(u.item.name) + '</div>' +
        '<div class="cell-sub">' + fmtDate(u.date, { short: true }) + ' · ' + relativeDay(u.date) + ' · ' + FREQUENCIES[u.item.frequency].label + (isTr ? ' · transfer' : '') + '</div></div>' +
        '<span class="evt-amt num ' + (isIn ? 'pos' : '') + '">' + (isIn ? '+' : isTr ? '' : '−') + fmtMoney(u.amtBase) + '</span></div>';
    }).join('') + '</div>' : emptyState('calendar', 'Nothing scheduled in this window.')) + '</div>';

  const monthlyTotal = { inc: 0, out: 0 };
  for (const it of DB.scheduled){
    const m = Calc.monthlyized(it);
    if (it.type === 'income') monthlyTotal.inc += m;
    else if (it.type !== 'transfer') monthlyTotal.out += m;
  }
  html += '<div class="card"><div class="card-head"><div><div class="card-title">Scheduled items (' + DB.scheduled.length + ')</div>' +
    '<div class="card-sub">≈ ' + fmtMoney(monthlyTotal.inc, null, { compact: true }) + '/mo in · ' + fmtMoney(monthlyTotal.out, null, { compact: true }) + '/mo out (transfers excluded)</div></div></div>' +
    (DB.scheduled.length ? '<div class="tbl-wrap" style="max-height:420px;overflow-y:auto"><table class="tbl"><thead><tr><th>Item</th><th>Every</th><th class="num">Amount</th><th class="num">Next</th><th></th></tr></thead><tbody>' +
      sortBy(DB.scheduled.map(it => ({ it, next: Calc.occurrences(it, todayISO(), addDaysISO(todayISO(), 400))[0] || '9999' })), x => x.next)
        .map(({ it, next }) =>
        '<tr><td><div class="cell-main">' + esc(it.name) + '</div><div class="cell-sub">' + TX_TYPES[it.type].label + (it.categoryId ? ' · ' + esc(Calc.catName(it.categoryId)) : '') + '</div></td>' +
        '<td class="small">' + FREQUENCIES[it.frequency].label + '</td>' +
        '<td class="num">' + fmtMoney(it.amount, it.currency) + '</td>' +
        '<td class="num small">' + (next !== '9999' ? fmtDate(next, { short: true }) : '—') + '</td>' +
        '<td><div class="row-actions">' +
        '<button class="icon-btn" data-action="sch.edit" data-id="' + it.id + '" aria-label="Edit ' + esc(it.name) + '">' + icon('edit', 14) + '</button>' +
        '<button class="icon-btn" data-action="sch.del" data-id="' + it.id + '" aria-label="Delete ' + esc(it.name) + '">' + icon('trash', 14) + '</button>' +
        '</div></td></tr>').join('') + '</tbody></table></div>'
      : emptyState('cashflow', 'Add paydays, rent, subscriptions and bills to project your cash.', '<button class="btn btn-primary" data-action="sch.add">' + icon('plus', 14) + ' Add scheduled item</button>')) +
    '</div>';
  html += '</div>';
  return html;
};

function scheduledModal(id){
  const it = id ? DB.scheduled.find(x => x.id === id) : null;
  const rows = [
    [{ key: 'name', label: 'Name', required: true, value: it ? it.name : '', placeholder: 'e.g. Rent, Salary, Car insurance' }],
    [{ key: 'type', label: 'Type', type: 'select', options: Object.entries(TX_TYPES).filter(([k]) => k !== 'refund').map(([k, v]) => [k, v.label]), value: it ? it.type : 'expense' },
     { key: 'frequency', label: 'Frequency', type: 'select', options: Object.entries(FREQUENCIES).map(([k, v]) => [k, v.label]), value: it ? it.frequency : 'monthly' }],
    [{ key: 'amount', label: 'Amount', type: 'number', required: true, min: 0, value: it ? it.amount : '' },
     { key: 'currency', label: 'Currency', type: 'select', options: selCurrencies(), value: it ? it.currency : DB.settings.baseCurrency }],
    [{ key: 'startDate', label: 'First (or next) date', type: 'date', required: true, value: it ? it.startDate : todayISO(), hint: 'Monthly items repeat on this day of the month.' },
     { key: 'endDate', label: 'End date (optional)', type: 'date', value: it ? (it.endDate || '') : '' }],
    [{ key: 'accountId', label: 'Account', type: 'select', options: selAccounts(), value: it ? it.accountId : (DB.accounts.find(a => !a.archived) || {}).id },
     { key: 'toAccountId', label: 'To account (transfers)', type: 'select', options: [['', '—']].concat(selAccounts()), value: it ? (it.toAccountId || '') : '' }],
    [{ key: 'categoryId', label: 'Category', type: 'select', options: [['', '—']].concat(selCategories()), value: it ? (it.categoryId || '') : '' },
     { key: 'notes', label: 'Notes', value: it ? it.notes : '' }]
  ];
  editModal({
    title: it ? 'Edit scheduled item' : 'Add scheduled item', rows, wide: true,
    onDelete: it ? () => { closeModal(); removeWithUndo('scheduled', it.id, 'Scheduled item'); } : null,
    validate(v){
      if (v.type === 'transfer' && !v.toAccountId) return 'Transfers need a destination account.';
      if (v.endDate && v.endDate < v.startDate) return 'End date is before the start date.';
      return null;
    },
    onSave(v){
      if (it) Object.assign(it, v, { endDate: v.endDate || null, toAccountId: v.toAccountId || null, categoryId: v.categoryId || null });
      else DB.scheduled.push(Object.assign({ id: uid('sch') }, v, { endDate: v.endDate || null, toAccountId: v.toAccountId || null, categoryId: v.categoryId || null }));
      save(); closeModal(); render();
      toast(it ? 'Scheduled item updated' : 'Scheduled item added');
    }
  });
}
UI.actions['sch.add'] = () => scheduledModal(null);
UI.actions['sch.edit'] = d => scheduledModal(d.id);
UI.actions['sch.del'] = d => removeWithUndo('scheduled', d.id, 'Scheduled item');
UI.actions['cf.range'] = d => { UI.state.cfDays = Number(d.d); render(); };

/* ============================ BUDGET ============================ */
Views.budget = function(){
  const mk = UI.state.budgetMonth || monthKey(todayISO());
  UI.state.budgetMonth = mk;
  const rows = Calc.budgetRows(mk);
  const stats = Calc.monthStats(mk, 'all');
  const planned = sum(rows, r => r.budget);
  const spent = sum(rows.filter(r => r.budget > 0), r => r.actual);
  const forecastT = sum(rows.filter(r => r.budget > 0), r => r.forecastEOM);
  const isCurrent = mk === monthKey(todayISO());
  const mode = UI.state.budgetMode || 'cats';
  const money0 = v => fmtMoney(v, null, { compact: true });

  let html = pageHead('Budget & spending plan',
    'Targets per category with rollover and sinking-fund support. Actuals come from your transactions (transfers, investing and debt payments excluded).');

  html += '<div class="spread mb12"><div class="row">' +
    '<button class="icon-btn" data-action="bud.month" data-d="-1" aria-label="Previous month">' + icon('chevl') + '</button>' +
    '<span class="b" style="min-width:110px;text-align:center">' + monthLabel(mk) + '</span>' +
    '<button class="icon-btn" data-action="bud.month" data-d="1" aria-label="Next month">' + icon('chevr') + '</button></div>' +
    '<div class="seg seg-sm" role="group" aria-label="Budget mode">' +
    '<button data-action="bud.mode" data-m="cats" aria-pressed="' + (mode === 'cats') + '">Categories</button>' +
    '<button data-action="bud.mode" data-m="model" aria-pressed="' + (mode === 'model') + '">High-level model</button></div></div>';

  html += '<div class="kpis">';
  html += kpiHTML({ label: 'Planned', value: fmtMoney(planned), note: 'across ' + rows.filter(r => r.budget > 0).length + ' budgeted categories' });
  html += kpiHTML({ label: isCurrent ? 'Spent so far' : 'Spent', value: fmtMoney(spent) });
  html += kpiHTML({ label: 'Remaining', value: moneyWrap(planned - spent), note: 'incl. rollover: ' + fmtMoney(sum(rows, r => r.avail) - spent) });
  if (isCurrent) html += kpiHTML({ label: 'Forecast end of month', value: fmtMoney(forecastT), valueClass: forecastT > planned ? 'neg' : '', info: 'Current spend, extrapolated linearly across the month per category.' });
  const worst = sortBy(rows.filter(r => r.budget > 0), r => r.variance)[0];
  if (worst && worst.variance < 0) html += kpiHTML({ label: 'Largest overspend', value: '<span class="neg">' + fmtMoney(-worst.variance) + '</span>', note: esc(worst.cat.name) });
  html += '</div>';

  if (mode === 'model'){
    const mb = Calc.modelBuckets(mk);
    const target = DB.settings.modelSplit;
    const labels = Object.keys(GROUPS).map(g => GROUPS[g].label);
    const actualPct = Object.keys(GROUPS).map(g => mb.income > 0 ? mb.buckets[g] / mb.income * 100 : 0);
    const targetPct = Object.keys(GROUPS).map(g => toNum(target[g], 0));
    html += Chart.card({
      title: 'Needs · Wants · Saving · Investing · Debt', sub: 'Share of income in ' + monthLabel(mk) + ' vs your targets (edit targets in Settings)',
      render: el => Chart.columns(el, {
        labels, series: [
          { name: 'Actual', color: '--s1', values: actualPct },
          { name: 'Target', color: '--s2', values: targetPct }
        ], yFmt: v => fmtPct(v, 0), yFmt2: v => fmtPct(v, 1), height: 210
      }),
      legend: { series: [{ name: 'Actual', color: '--s1' }, { name: 'Target', color: '--s2' }], mark: 'rect' },
      table: { head: ['Bucket', 'Actual', 'Target', 'Amount'], rows: labels.map((l, i) => [l, fmtPct(actualPct[i], 1), fmtPct(targetPct[i], 0), fmtMoney(Object.values(mb.buckets)[i])]) },
      note: 'Saving = income left after spending and debt payments. Investing includes payroll contributions. Income here = take-home + payroll investing.'
    });
  } else {
    /* variance chart + editable table */
    const varRows = sortBy(rows.filter(r => r.budget > 0), r => r.variance).slice(0, 8)
      .map(r => ({ label: r.cat.name, value: round2(r.variance) }));
    html += Chart.card({
      title: 'Variance vs plan', sub: 'Right of the line = under budget (available), left = over',
      render: el => Chart.hbars(el, { rows: varRows, fmt: v => fmtMoney(v, null, { sign: true }), diverging: true, aria: 'Budget variance by category' }),
      table: { head: ['Category', 'Variance'], rows: varRows.map(r => [r.label, fmtMoney(r.value, null, { sign: true })]) }
    });

    html += '<div class="card mb12"><div class="card-head"><div class="card-title">Category budgets</div>' +
      '<div class="card-sub">Set monthly targets · rollover carries unspent budget forward within the financial year</div></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Category</th><th class="num">Budget/mo</th><th>Rollover</th><th class="num">Carry-in</th><th class="num">Spent</th><th class="num">Left</th>' + (isCurrent ? '<th class="num">Pace</th>' : '') + '<th style="min-width:110px">Used</th></tr></thead><tbody>' +
      rows.map(r => {
        const used = r.avail > 0 ? clamp(r.actual / r.avail * 100, 0, 130) : (r.actual > 0 ? 130 : 0);
        const lvl = r.avail <= 0 ? '' : r.actual > r.avail ? 'crit' : r.actual > r.avail * 0.85 ? 'warn' : 'good';
        return '<tr><td><div class="cell-main">' + esc(r.cat.name) + '</div><div class="cell-sub">' +
          (r.cat.essential ? 'essential' : 'discretionary') + ' · ' + (r.cat.fixed ? 'fixed' : 'variable') + '</div></td>' +
          '<td class="num"><input class="input num" type="number" step="any" min="0" style="width:88px;padding:4px 8px" value="' + (r.budget || '') + '" data-change="bud.set" data-cat="' + r.cat.id + '" aria-label="Budget for ' + esc(r.cat.name) + '"></td>' +
          '<td><input type="checkbox" data-change="bud.roll" data-cat="' + r.cat.id + '"' + (r.rollover ? ' checked' : '') + (r.budget ? '' : ' disabled') + ' aria-label="Rollover for ' + esc(r.cat.name) + '"></td>' +
          '<td class="num muted">' + (r.rollover ? fmtMoney(r.carry, null, { sign: true }) : '—') + '</td>' +
          '<td class="num">' + fmtMoney(r.actual) + '</td>' +
          '<td class="num b ' + signClass(r.remaining) + '">' + fmtMoney(r.remaining) + '</td>' +
          (isCurrent ? '<td class="num muted">' + (r.budget ? fmtMoney(r.forecastEOM) : '—') + '</td>' : '') +
          '<td>' + (r.avail > 0 || r.actual > 0 ? '<div class="meter ' + lvl + '" style="margin:0"><div class="meter-track"><div class="meter-fill" style="width:' + Math.min(100, used) + '%"></div></div></div>' : '') + '</td></tr>';
      }).join('') +
      '</tbody><tfoot><tr><td>Total</td><td class="num">' + fmtMoney(planned) + '</td><td></td><td></td><td class="num">' + fmtMoney(spent) + '</td>' +
      '<td class="num ' + signClass(planned - spent) + '">' + fmtMoney(planned - spent) + '</td>' + (isCurrent ? '<td class="num">' + fmtMoney(forecastT) + '</td>' : '') + '<td></td></tr></tfoot></table></div>' +
      '<div class="note mt8">Type in the Budget column to set or change a target. Categories with spending but no budget still appear here.</div></div>';

    /* annual & sinking */
    const ap = Calc.annualPlan();
    if (ap.length){
      const totMo = sum(ap, r => r.perMonth);
      html += '<div class="card mb12"><div class="card-head"><div><div class="card-title">Annual & irregular expenses</div>' +
        '<div class="card-sub">Sinking-fund view: set aside ≈ <strong>' + fmtMoney(totMo) + '/month</strong> and these stop being surprises</div></div></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Every</th><th class="num">Next due</th><th class="num">Amount</th><th class="num">Set aside /mo</th></tr></thead><tbody>' +
        ap.map(r => '<tr><td>' + esc(r.item.name) + '</td><td class="small">' + FREQUENCIES[r.item.frequency].label + '</td>' +
          '<td class="num">' + fmtDate(r.next, { short: true }) + '</td><td class="num">' + fmtMoney(r.amount) + '</td><td class="num">' + fmtMoney(r.perMonth) + '</td></tr>').join('') +
        '</tbody></table></div></div>';
    }

    /* savings target */
    const s = stats;
    html += '<div class="card"><div class="card-head"><div class="card-title">Savings-rate target</div></div>' +
      '<div class="row" style="gap:24px">' +
      '<div><div class="kpi-label">This month (cash basis)</div><div class="b num" style="font-size:19px">' + (s.savingsRate == null ? '—' : fmtPct(s.savingsRate, 0)) + '</div></div>' +
      '<div><div class="kpi-label">Incl. payroll investing</div><div class="b num" style="font-size:19px">' + (s.savingsRateIncl == null ? '—' : fmtPct(s.savingsRateIncl, 0)) + '</div></div>' +
      '<div><div class="kpi-label">Target</div><div class="b num" style="font-size:19px">' + fmtPct(DB.settings.savingsTarget, 0) + '</div></div>' +
      '<div style="flex:1;min-width:160px">' + (s.savingsRate != null ? '<div class="meter ' + (s.savingsRate >= DB.settings.savingsTarget ? 'good' : 'warn') + '"><div class="meter-track"><div class="meter-fill" style="width:' + clamp(s.savingsRate / Math.max(1, DB.settings.savingsTarget) * 100, 0, 100) + '%"></div></div></div>' : '') + '</div>' +
      '</div></div>';
  }
  return html;
};
UI.actions['bud.month'] = d => { UI.state.budgetMonth = shiftMonthKey(UI.state.budgetMonth || monthKey(todayISO()), Number(d.d)); render(); };
UI.actions['bud.mode'] = d => { UI.state.budgetMode = d.m; render(); };
UI.changes['bud.set'] = (d, el) => {
  const v = toNum(el.value, 0);
  if (v > 0) DB.budgets[d.cat] = Object.assign({ rollover: false }, DB.budgets[d.cat], { amount: v });
  else delete DB.budgets[d.cat];
  save(); render();
};
UI.changes['bud.roll'] = (d, el) => {
  if (DB.budgets[d.cat]){ DB.budgets[d.cat].rollover = el.checked; save(); render(); }
};

/* ============================ GOALS ============================ */
Views.goals = function(){
  const plan = Calc.goalPlan();
  let html = pageHead('Life goals',
    'Each goal projects forward from its current amount, planned monthly contribution and expected return. Link a goal to an account and its balance becomes the goal’s progress automatically.',
    '<button class="btn btn-primary" data-action="goal.add">' + icon('plus', 14) + ' Add goal</button>');

  if (DB.goals.length){
    const lvl = plan.gap >= 0 ? 'good' : 'crit';
    html += '<div class="card mb12"><div class="card-head"><div><div class="card-title">Priorities & capacity</div>' +
      '<div class="card-sub">Planned contributions vs what recent months say you can fund (avg cash surplus + payroll investing, last 3 complete months)</div></div></div>' +
      '<div class="row" style="gap:24px">' +
      '<div><div class="kpi-label">Planned across goals</div><div class="b num" style="font-size:19px">' + fmtMoney(plan.planned) + '/mo</div></div>' +
      '<div><div class="kpi-label">Estimated capacity</div><div class="b num" style="font-size:19px">' + fmtMoney(plan.capacity) + '/mo</div></div>' +
      '<div><div class="kpi-label">' + (plan.gap >= 0 ? 'Headroom' : 'Shortfall') + '</div><div class="b num ' + signClass(plan.gap) + '" style="font-size:19px">' + fmtMoney(Math.abs(plan.gap)) + '/mo</div></div>' +
      '<div style="flex:1;min-width:170px"><div class="meter ' + lvl + '"><div class="meter-track"><div class="meter-fill" style="width:' + clamp(plan.capacity > 0 ? plan.planned / plan.capacity * 100 : 100, 2, 100) + '%"></div></div>' +
      '<div class="meter-label"><span>' + fmtPct(plan.capacity > 0 ? plan.planned / plan.capacity * 100 : 0, 0) + ' of capacity committed</span></div></div></div></div>' +
      (plan.gap < 0 ? '<div class="warn-note mt12">' + icon('alert') + '<div>Your goals compete for more than recent surpluses provided. Lower a contribution, push a date, or free up spending — the cards below show each goal’s required pace.</div></div>' : '') +
      '</div>';
  }

  const prioPill = { high: '<span class="pill crit">High</span>', medium: '<span class="pill warn">Medium</span>', low: '<span class="pill neutral">Low</span>' };
  html += '<div class="grid g2">';
  if (!DB.goals.length){
    html += '<div class="card">' + emptyState('goals', 'No goals yet. An emergency fund or a house deposit is a good first one.',
      '<button class="btn btn-primary" data-action="goal.add">' + icon('plus', 14) + ' Add goal</button>') + '</div>';
  }
  for (const g of sortBy(DB.goals, g => ({ high: 0, medium: 1, low: 2 }[g.priority] ?? 3))){
    const m = Calc.goalMath(g);
    const lvl = m.onTrack === false ? 'warn' : 'good';
    const wi = [100, 250].map(extra => {
      const mm = Calc.goalMath(Object.assign({}, g, { monthly: (toNum(g.monthly, 0) + extra) }));
      return { extra, date: mm.projDate, saved: m.projMonths != null && mm.projMonths != null ? m.projMonths - mm.projMonths : null };
    });
    html += '<div class="card goal-card">' +
      '<div class="goal-top"><div><div class="goal-name">' + esc(g.name) + '</div>' +
      '<div class="goal-meta">' + (g.category ? '<span class="tag">' + esc(g.category) + '</span>' : '') + ownerBadge(g.owner) + prioPill[g.priority] +
      (g.accountId ? '<span class="tag" title="Progress tracks this account">' + esc(Calc.accName(g.accountId)) + '</span>' : '') + '</div></div>' +
      '<div class="row" style="gap:2px">' +
      '<button class="icon-btn" data-action="goal.edit" data-id="' + g.id + '" aria-label="Edit ' + esc(g.name) + '">' + icon('edit', 14) + '</button>' +
      '<button class="icon-btn" data-action="goal.del" data-id="' + g.id + '" aria-label="Delete ' + esc(g.name) + '">' + icon('trash', 14) + '</button></div></div>' +
      '<div class="goal-big num">' + fmtMoney(m.current, null, { compact: m.current >= 100000 }) + ' <span class="of">of ' + fmtMoney(m.target, null, { compact: m.target >= 100000 }) + (g.inflationAdj ? ' (inflation-adjusted)' : '') + '</span></div>' +
      '<div class="meter ' + lvl + '" style="margin:0"><div class="meter-track"><div class="meter-fill" style="width:' + m.pct.toFixed(1) + '%"></div></div>' +
      '<div class="meter-label"><span>' + fmtPct(m.pct, 0) + ' · ' + fmtMoney(m.remaining, null, { compact: true }) + ' to go</span>' +
      '<span>' + (g.targetDate ? 'target ' + monthLabel(monthKey(g.targetDate)) : 'no date') + '</span></div></div>' +
      '<div class="two-col-defs mt8">' +
      '<dt>Planned</dt><dd>' + fmtMoney(m.monthly) + '/mo at ' + fmtPct(toNum(g.expReturn, 0), 1) + '</dd>' +
      (m.requiredMonthly != null ? '<dt>Required</dt><dd class="' + (m.requiredMonthly > m.monthly + 1 ? 'neg' : 'pos') + '">' + fmtMoney(m.requiredMonthly) + '/mo to hit the date</dd>' : '') +
      (m.projDate ? '<dt>Projected</dt><dd>' + monthLabel(monthKey(m.projDate)) + (m.onTrack != null ? (m.onTrack ? ' · <span class="pos">on schedule</span>' : ' · <span class="neg">behind</span>') : '') + '</dd>'
        : '<dt>Projected</dt><dd class="muted">not reachable at current pace</dd>') +
      (wi[0].date && m.remaining > 0 ? '<dt>What if</dt><dd>+' + fmtMoney(100) + '/mo → ' + monthLabel(monthKey(wi[0].date)) + (wi[0].saved ? ' (' + wi[0].saved + ' mo sooner)' : '') +
        (wi[1].date ? ' · +' + fmtMoney(250) + '/mo → ' + monthLabel(monthKey(wi[1].date)) : '') + '</dd>' : '') +
      '</div>' +
      (g.notes ? '<div class="note">' + esc(g.notes) + '</div>' : '') +
      '</div>';
  }
  html += '</div>';
  if (DB.goals.length){
    html += '<div class="note mt4">Projections assume steady contributions and the stated return, compounded monthly — estimates, not promises.</div>';
  }
  return html;
};

function goalModal(id){
  const g = id ? DB.goals.find(x => x.id === id) : null;
  const rows = [
    [{ key: 'name', label: 'Goal name', required: true, value: g ? g.name : '', placeholder: 'e.g. House deposit' },
     { key: 'category', label: 'Category', value: g ? g.category : '', placeholder: 'Home, Travel, Safety…' }],
    [{ key: 'target', label: 'Target amount (' + DB.settings.baseCurrency + ')', type: 'number', required: true, min: 1, value: g ? g.target : '' },
     { key: 'targetDate', label: 'Target date', type: 'date', value: g ? (g.targetDate || '') : '' },
     { key: 'priority', label: 'Priority', type: 'select', options: [['high', 'High'], ['medium', 'Medium'], ['low', 'Low']], value: g ? g.priority : 'medium' }],
    [{ key: 'accountId', label: 'Linked account (optional)', type: 'select', options: [['', '— track manually —']].concat(selAccounts(a => ACCOUNT_TYPES[a.type].kind === 'asset')), value: g ? (g.accountId || '') : '',
       hint: 'When linked, the account balance becomes the goal’s current amount.' },
     { key: 'current', label: 'Current amount (if manual)', type: 'number', min: 0, value: g && g.current != null ? g.current : 0 }],
    [{ key: 'monthly', label: 'Planned monthly contribution', type: 'number', min: 0, value: g ? g.monthly : '' },
     { key: 'expReturn', label: 'Expected return % / yr', type: 'number', value: g ? g.expReturn : 0, hint: '0 for cash, ~4% for high-yield savings; be conservative for investments.' },
     { key: 'owner', label: 'Owner', type: 'select', options: selOwners(), value: g ? g.owner : DB.settings.defaultOwner }],
    [{ key: 'inflationAdj', label: 'Grow target with inflation (for far-off goals)', type: 'checkbox', value: g ? !!g.inflationAdj : false }],
    [{ key: 'notes', label: 'Notes', type: 'textarea', value: g ? g.notes : '' }]
  ];
  editModal({
    title: g ? 'Edit goal' : 'Add goal', rows, wide: true,
    onDelete: g ? () => { closeModal(); removeWithUndo('goals', g.id, 'Goal'); } : null,
    onSave(v){
      const rec = Object.assign({}, v, { accountId: v.accountId || null, targetDate: v.targetDate || null });
      if (g) Object.assign(g, rec);
      else DB.goals.push(Object.assign({ id: uid('goal') }, rec));
      save(); closeModal(); render();
      toast(g ? 'Goal updated' : 'Goal added');
    }
  });
}
UI.actions['goal.add'] = () => goalModal(null);
UI.actions['goal.edit'] = d => goalModal(d.id);
UI.actions['goal.del'] = d => removeWithUndo('goals', d.id, 'Goal');

/* =========================== FORECAST =========================== */
Views.forecast = function(){
  const S = DB.settings;
  const P = Calc.baselineParams();
  const cases = DB.forecast.cases;
  const real = UI.state.forecastReal;
  const rBase = Calc.runForecast(P, cases.base);
  const rCons = Calc.runForecast(P, cases.cons);
  const rOpt = Calc.runForecast(P, cases.opt);
  const money0 = v => fmtMoney(v, null, { compact: true });
  const ov = DB.forecast.overrides || {};

  let html = pageHead('Wealth forecast',
    'A deterministic long-term projection from your current position and assumptions. These are <strong>estimates based on assumptions you control</strong> — real life will differ.');

  /* assumptions */
  const inp = (label, key, val, opts) =>
    '<div class="field"><label>' + label + (opts && opts.info ? ' <button type="button" class="info-dot" data-tip="' + esc(opts.info) + '">i</button>' : '') + '</label>' +
    '<input class="input" type="number" step="any" data-change="fc.set" data-k="' + key + '" value="' + (val == null ? '' : val) + '"' +
    (opts && opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + '>' +
    (opts && opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';

  html += '<div class="grid g2">';
  html += '<div class="card"><div class="card-head"><div class="card-title">Household</div></div><div class="form">' +
    '<div class="frow">' + inp('Your age', 'age', S.age) + inp('Partner’s age', 'partnerAge', S.partnerAge) + '</div>' +
    '<div class="frow">' + inp('Retirement age', 'retirementAge', S.retirementAge) +
    inp('Retirement spending /mo (today’s money)', 'retireSpend', S.retireSpend, { info: 'What the household would spend monthly in retirement, in today’s prices. It is inflated over time in the projection.' }) + '</div>' +
    '</div></div>';
  html += '<div class="card"><div class="card-head"><div><div class="card-title">Monthly flows</div><div class="card-sub">Blank = use your recent 3-month average</div></div></div><div class="form">' +
    '<div class="frow f3">' +
    inp('Income /mo', 'ov.income', ov.income, { ph: 'auto ' + Math.round(P.incomeMonthly) }) +
    inp('Spending /mo', 'ov.spend', ov.spend, { ph: 'auto ' + Math.round(P.spendMonthly) }) +
    inp('Investing /mo', 'ov.invest', ov.invest, { ph: 'auto ' + Math.round(P.investMonthly) }) + '</div>' +
    '<div class="hint">Starting from ' + fmtMoney(P.startCash, null, { compact: true }) + ' cash, ' + fmtMoney(P.startInvested, null, { compact: true }) + ' invested, ' +
    fmtMoney(sum(P.debts, d => d.balance), null, { compact: true }) + ' of debt (from your accounts). Debt payments amortise using each account’s rate and monthly payment; debts without a payment set are modelled at a typical minimum payment.</div>' +
    '</div></div>';
  html += '</div>';

  const caseInp = (ck, k, label) =>
    '<div class="field"><label>' + label + '</label><input class="input" type="number" step="0.1" data-change="fc.case" data-c="' + ck + '" data-k="' + k + '" value="' + cases[ck][k] + '"></div>';
  html += '<div class="card mb12"><div class="card-head"><div><div class="card-title">Cases</div><div class="card-sub">Annual rates in % — keep the base case honest and let the others bracket it</div></div></div>' +
    '<div class="grid g3" style="margin-bottom:0">' + ['cons', 'base', 'opt'].map(ck =>
      '<fieldset><legend>' + esc(cases[ck].label) + '</legend><div class="frow f3">' +
      caseInp(ck, 'ret', 'Return') + caseInp(ck, 'infl', 'Inflation') + caseInp(ck, 'growth', 'Income growth') +
      '</div></fieldset>').join('') + '</div></div>';

  /* chart */
  const defl = (r, c) => real ? Math.pow(1 + toNum(c.infl, 0) / 100, r.yi) : 1;
  const labels = rBase.rows.map(r => String(r.age));
  html += Chart.card({
    title: 'Projected net worth', sub: (real ? 'In today’s money (deflated by each case’s inflation)' : 'Nominal') + ' · base case emphasised',
    actionsHTML: '<div class="seg seg-sm"><button data-action="fc.real" data-v="0" aria-pressed="' + (!real) + '">Nominal</button>' +
      '<button data-action="fc.real" data-v="1" aria-pressed="' + (!!real) + '">Today’s money</button></div>',
    render: el => Chart.line(el, {
      labels,
      series: [
        { name: cases.opt.label, rawColor: cssVar('--spark'), dash: true, values: rOpt.rows.map(r => r.net / defl(r, cases.opt)) },
        { name: cases.base.label, color: '--s1', values: rBase.rows.map(r => r.net / defl(r, cases.base)) },
        { name: cases.cons.label, rawColor: cssVar('--spark'), dash: true, values: rCons.rows.map(r => r.net / defl(r, cases.cons)) }
      ],
      endLabels: true, endLabelFmt: s => s.name.slice(0, 4).toLowerCase(),
      height: 240, yFmt: money0, yFmt2: v => fmtMoney(v), zero: true, xTicksEvery: 5,
      aria: 'Projected net worth by age for three cases'
    }),
    legend: { series: [{ name: 'Base', color: '--s1' }, { name: 'Conservative / Optimistic', rawColor: cssVar('--spark') }], mark: 'line' },
    table: { head: ['Age', 'Conservative', 'Base', 'Optimistic'], rows: rBase.rows.map((r, i) => [String(r.age), fmtMoney(rCons.rows[i].net / defl(rCons.rows[i], cases.cons)), fmtMoney(r.net / defl(r, cases.base)), fmtMoney(rOpt.rows[i].net / defl(rOpt.rows[i], cases.opt))]) },
    note: 'X-axis is your age. Retirement at ' + P.retireAge + ' switches income off and spending to the retirement level.'
  });

  /* milestone table */
  const marks = rBase.rows.filter(r => r.age % 5 === 0 || r.age === P.retireAge);
  html += '<div class="card mb12"><div class="card-head"><div class="card-title">Milestones — base case' + (real ? ' (today’s money)' : '') + '</div></div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Age</th><th>Year</th><th class="num">Cash</th><th class="num">Invested</th><th class="num">Debt</th><th class="num">Net worth</th></tr></thead><tbody>' +
    marks.map(r => {
      const f = defl(r, cases.base);
      return '<tr' + (r.age === P.retireAge ? ' style="background:var(--accent-wash)"' : '') + '><td class="b">' + r.age + (r.age === P.retireAge ? ' <span class="tag">retire</span>' : '') + '</td><td class="muted">' + r.year + '</td>' +
        '<td class="num">' + fmtMoney(r.cash / f, null, { compact: true }) + '</td><td class="num">' + fmtMoney(r.invested / f, null, { compact: true }) + '</td>' +
        '<td class="num ' + (r.debt > 0 ? 'neg' : '') + '">' + fmtMoney(-r.debt / f, null, { compact: true }) + '</td><td class="num b">' + fmtMoney(r.net / f, null, { compact: true }) + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';

  /* retirement readout */
  const rr = rBase.retireRow;
  const okRet = rBase.sustainableMonthlyReal >= P.retireSpend;
  html += '<div class="grid g2">';
  html += '<div class="card"><div class="card-head"><div class="card-title">Retirement estimate — base case</div></div>' +
    '<div class="two-col-defs">' +
    '<dt>Invested at ' + P.retireAge + '</dt><dd>' + (rr ? fmtMoney(rr.invested, null, { compact: true }) : '—') + ' nominal</dd>' +
    '<dt>Sustainable spend</dt><dd>' + fmtMoney(rBase.sustainableMonthlyReal, null, { compact: true }) + '/mo in today’s money <button type="button" class="info-dot" data-tip="A rough 4%-a-year withdrawal estimate: invested assets × 4% ÷ 12, deflated back to today’s prices. A planning yardstick, not a guarantee.">i</button></dd>' +
    '<dt>Your target</dt><dd>' + fmtMoney(P.retireSpend) + '/mo</dd>' +
    '<dt>Verdict</dt><dd>' + (okRet ? '<span class="pill good">' + icon('check', 11) + ' covers target</span>' : '<span class="pill warn">' + icon('alert', 11) + ' short of target</span>') + '</dd>' +
    '</div>' +
    (rBase.depleted ? '<div class="warn-note mt12">' + icon('alert') + '<div>In this case, assets run out around age <strong>' + rBase.depleted.age + '</strong>. More investing, later retirement, or lower retirement spending closes the gap.</div></div>' : '') +
    '</div>';

  /* major expenses */
  html += '<div class="card"><div class="card-head"><div><div class="card-title">Major future expenses</div><div class="card-sub">One-offs subtracted in the year they occur</div></div>' +
    '<button class="btn btn-sm" data-action="fc.exp.add">' + icon('plus', 13) + ' Add</button></div>' +
    ((DB.forecast.majorExpenses || []).length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Label</th><th class="num">Year</th><th class="num">Amount</th><th></th></tr></thead><tbody>' +
      DB.forecast.majorExpenses.map(e => '<tr><td>' + esc(e.label) + '</td><td class="num">' + e.year + '</td><td class="num">' + fmtMoney(e.amount) + '</td>' +
        '<td><div class="row-actions"><button class="icon-btn" data-action="fc.exp.del" data-id="' + e.id + '" aria-label="Remove ' + esc(e.label) + '">' + icon('trash', 13) + '</button></div></td></tr>').join('') +
      '</tbody></table></div>' : '<div class="note">None yet — a house purchase, car replacement or big trip belongs here.</div>') +
    '</div>';
  html += '</div>';
  html += '<div class="note mt4">Simplified model: one blended return, income and investing grow with salary growth, spending grows with inflation, cash above a ~6-month buffer is swept into investments, and retirement withdraws from cash then investments. No taxes or market swings are modelled.</div>';
  return html;
};
UI.changes['fc.set'] = (d, el) => {
  const v = toNum(el.value, null);
  if (d.k.startsWith('ov.')){
    DB.forecast.overrides = DB.forecast.overrides || {};
    DB.forecast.overrides[d.k.slice(3)] = v;
  } else {
    DB.settings[d.k] = v;
  }
  save(); render();
};
UI.changes['fc.case'] = (d, el) => {
  DB.forecast.cases[d.c][d.k] = toNum(el.value, 0);
  save(); render();
};
UI.actions['fc.real'] = d => { UI.state.forecastReal = d.v === '1'; render(); };
UI.actions['fc.exp.add'] = () => {
  editModal({
    title: 'Add major future expense',
    rows: [[{ key: 'label', label: 'Label', required: true, placeholder: 'e.g. House purchase' }],
      [{ key: 'year', label: 'Year', type: 'number', required: true, value: new Date().getFullYear() + 2, min: new Date().getFullYear() },
       { key: 'amount', label: 'Amount (' + DB.settings.baseCurrency + ')', type: 'number', required: true, min: 1 }]],

      DB.forecast.majorExpenses.push({ id: uid('exp'), label: v.label, year: v.year, amount: v.amount });
      save(); closeModal(); render();
    }
  });
};
UI.actions['fc.exp.del'] = d => {
  DB.forecast.majorExpenses = DB.forecast.majorExpenses.filter(e => e.id !== d.id);
  save(); render();
};

/* =========================== SCENARIOS =========================== */
function blankScenario(){
  return { id: null, name: 'New scenario', template: null, notes: '',
    overrides: { incomePct: 0, incomeAbs: 0, spendPct: 0, spendAbs: 0, investAbs: 0, retDelta: 0, inflDelta: 0, extraDebt: 0, oneOffs: [] } };
}
Views.scenarios = function(){
  if (!UI.state.scnDraft){
    UI.state.scnDraft = DB.scenarios.length ? deepClone(DB.scenarios[0]) : blankScenario();
  }
  const draft = UI.state.scnDraft;
  const o = draft.overrides;
  const cmp = Calc.scenarioCompare(o);
  const money0 = v => fmtMoney(v, null, { compact: true });

  let html = pageHead('Scenario simulator',
    'Duplicate your baseline, change assumptions, and see the difference — your real data never changes. Baseline uses the Forecast page’s base case.');

  /* templates + saved */
  html += '<div class="card mb12"><div class="card-head"><div class="card-title">Start from a template</div></div><div class="chips">' +
    Calc.scenarioTemplates().map(t => '<button class="chip" data-action="scn.tpl" data-id="' + t.id + '"' + (t.note ? ' title="' + esc(t.note) + '"' : '') + '>' + esc(t.name) + '</button>').join('') +
    '<button class="chip" data-action="scn.new">' + icon('plus', 12) + ' Blank</button></div>' +
    (DB.scenarios.length ? '<div class="row mt12"><span class="small muted">Saved:</span>' +
      DB.scenarios.map(s => '<button class="chip" data-action="scn.load" data-id="' + s.id + '" aria-pressed="' + (draft.id === s.id) + '">' + esc(s.name) + '</button>').join('') + '</div>' : '') +
    '</div>';

  /* editor */
  const num = (label, k, val, hint) =>
    '<div class="field"><label>' + label + '</label><input class="input" type="number" step="any" data-change="scn.set" data-k="' + k + '" value="' + (val || 0) + '">' +
    (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  html += '<div class="grid g13">';
  html += '<div class="card"><div class="card-head"><div class="card-title">Scenario assumptions</div></div><div class="form">' +
    '<div class="field"><label>Name</label><input class="input" data-change="scn.set" data-k="name" value="' + esc(draft.name) + '"></div>' +
    '<div class="frow">' + num('Income change %', 'incomePct', o.incomePct, 'e.g. −52 = lose one of two similar salaries') + num('Income change ' + baseSymbol() + '/mo', 'incomeAbs', o.incomeAbs) + '</div>' +
    '<div class="frow">' + num('Spending change %', 'spendPct', o.spendPct) + num('Spending change ' + baseSymbol() + '/mo', 'spendAbs', o.spendAbs, 'new housing costs, childcare…') + '</div>' +
    '<div class="frow">' + num('Investing change ' + baseSymbol() + '/mo', 'investAbs', o.investAbs) + num('Extra debt payment ' + baseSymbol() + '/mo', 'extraDebt', o.extraDebt, 'applied to the highest-rate debt') + '</div>' +
    '<div class="frow">' + num('Return delta % /yr', 'retDelta', o.retDelta, 'e.g. −2.5 = returns fall') + num('Inflation delta % /yr', 'inflDelta', o.inflDelta) + '</div>' +
    '<div><div class="spread"><label style="font-size:12px;font-weight:600;color:var(--ink-2)">One-off costs</label>' +
    '<button class="btn btn-sm" data-action="scn.oo.add">' + icon('plus', 13) + ' Add</button></div>' +
    (o.oneOffs.length ? o.oneOffs.map((oo, i) =>
      '<div class="row mt8"><input class="input" style="flex:2" placeholder="Label" data-change="scn.oo" data-i="' + i + '" data-k="label" value="' + esc(oo.label || '') + '" aria-label="One-off label">' +
      '<input class="input" style="width:88px" type="number" min="0" data-change="scn.oo" data-i="' + i + '" data-k="yearOffset" value="' + (oo.yearOffset || 1) + '" aria-label="Years from now" title="Years from now">' +
      '<input class="input" style="width:110px" type="number" step="any" data-change="scn.oo" data-i="' + i + '" data-k="amount" value="' + (oo.amount || 0) + '" aria-label="Amount">' +
      '<button class="icon-btn" data-action="scn.oo.del" data-i="' + i + '" aria-label="Remove one-off">' + icon('x', 14) + '</button></div>').join('')
      : '<div class="hint mt4">e.g. relocation, deposit, wedding — amount in year N from now.</div>') + '</div>' +
    '<div class="field"><label>Notes</label><textarea class="input" rows="2" data-change="scn.set" data-k="notes">' + esc(draft.notes || '') + '</textarea></div>' +
    '<div class="row">' +
    '<button class="btn btn-primary" data-action="scn.save">' + (draft.id ? 'Update scenario' : 'Save scenario') + '</button>' +
    (draft.id ? '<button class="btn btn-danger" data-action="scn.del" data-id="' + draft.id + '">Delete</button>' : '') +
    '</div></div></div>';

  /* comparison */
  const dRow = (label, b, s, fmt, goodUp) => {
    const d = (s == null || b == null) ? null : s - b;
    const cls = d == null ? '' : (goodUp === false ? signClass(-d) : signClass(d));
    return '<tr><td>' + label + '</td><td class="num">' + (b == null ? '—' : fmt(b)) + '</td><td class="num b">' + (s == null ? '—' : fmt(s)) + '</td>' +
      '<td class="num ' + cls + '">' + (d == null ? '—' : (d >= 0 ? '+' : '−') + fmt(Math.abs(d)).replace(/^[+-]/, '')) + '</td></tr>';
  };
  html += '<div>';
  html += Chart.card({
    title: 'Net worth — baseline vs “' + esc(draft.name) + '”', sub: 'Nominal, base-case rates' + (o.retDelta || o.inflDelta ? ' (scenario deltas applied)' : ''),
    render: el => Chart.line(el, {
      labels: cmp.base.rows.map(r => String(r.age)),
      series: [
        { name: 'Baseline', color: '--s1', values: cmp.base.rows.map(r => r.net) },
        { name: draft.name || 'Scenario', color: '--s2', values: cmp.scn.rows.map(r => r.net) }
      ],
      height: 220, yFmt: money0, yFmt2: v => fmtMoney(v), zero: true, xTicksEvery: 5, aria: 'Baseline versus scenario net worth'
    }),
    legend: { series: [{ name: 'Baseline', color: '--s1' }, { name: draft.name || 'Scenario', color: '--s2' }], mark: 'line' },
    table: { head: ['Age', 'Baseline', 'Scenario'], rows: cmp.base.rows.map((r, i) => [String(r.age), fmtMoney(r.net), fmtMoney(cmp.scn.rows[i] ? cmp.scn.rows[i].net : null)]) }
  });

  html += '<div class="card mt12"><div class="card-head"><div class="card-title">Side by side</div></div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Measure</th><th class="num">Baseline</th><th class="num">Scenario</th><th class="num">Δ</th></tr></thead><tbody>' +
    cmp.table.map(r => dRow('Net worth in ' + r.yi + ' year' + (r.yi > 1 ? 's' : ''), r.base, r.scn, v => fmtMoney(v, null, { compact: true }))).join('') +
    dRow('Monthly cash surplus (now)', cmp.surplusBase, cmp.surplusScn, v => fmtMoney(v)) +
    dRow('Emergency-fund runway', cmp.runwayBase, cmp.runwayScn, v => v.toFixed(1) + ' mo') +
    dRow('Debt-free year', cmp.debtFreeBase, cmp.debtFreeScn, v => String(Math.round(v)), false) +
    dRow('Retirement spend (today’s ' + baseSymbol() + '/mo)', cmp.retireBase, cmp.retireScn, v => fmtMoney(v, null, { compact: true })) +
    '</tbody></table></div>' +
    '<div class="note mt8">Runway = current cash ÷ (spending + debt payments). Debt-free year is the first projected year with no remaining debt. Retirement spend uses the same 4% yardstick as the Forecast page.</div></div>';
  html += '</div></div>';
  return html;
};
UI.actions['scn.tpl'] = d => {
  const t = Calc.scenarioTemplates().find(x => x.id === d.id);
  if (!t) return;
  const s = blankScenario();
  s.name = t.name; s.template = t.id;
  Object.assign(s.overrides, deepClone(t.o));
  s.overrides.oneOffs = (s.overrides.oneOffs || []).map(x => Object.assign({ id: uid('oo') }, x));
  if (t.note) s.notes = t.note;
  UI.state.scnDraft = s;
  render();
};
UI.actions['scn.new'] = () => { UI.state.scnDraft = blankScenario(); render(); };
UI.actions['scn.load'] = d => {
  const s = DB.scenarios.find(x => x.id === d.id);
  if (s){ UI.state.scnDraft = deepClone(s); render(); }
};
UI.actions['scn.save'] = () => {
  const draft = UI.state.scnDraft;
  if (!draft.name.trim()){ toast('Give the scenario a name first'); return; }
  if (draft.id){
    const i = DB.scenarios.findIndex(s => s.id === draft.id);
    if (i >= 0) DB.scenarios[i] = deepClone(draft);
    toast('Scenario updated');
  } else {
    draft.id = uid('scn');
    DB.scenarios.push(deepClone(draft));
    toast('Scenario saved');
  }
  save(); render();
};
UI.actions['scn.del'] = d => {
  confirmDialog({ title: 'Delete scenario?', message: 'Remove “' + esc(UI.state.scnDraft.name) + '” from saved scenarios?', confirmLabel: 'Delete', danger: true })
    .then(ok => {
      if (!ok) return;
      DB.scenarios = DB.scenarios.filter(s => s.id !== d.id);
      UI.state.scnDraft = blankScenario();
      save(); render();
    });
};
UI.actions['scn.oo.add'] = () => { UI.state.scnDraft.overrides.oneOffs.push({ id: uid('oo'), label: '', yearOffset: 1, amount: 0 }); render(); };
UI.actions['scn.oo.del'] = d => { UI.state.scnDraft.overrides.oneOffs.splice(Number(d.i), 1); render(); };
UI.changes['scn.set'] = (d, el) => {
  const draft = UI.state.scnDraft;
  if (d.k === 'name' || d.k === 'notes') draft[d.k] = el.value;
  else draft.overrides[d.k] = toNum(el.value, 0);
  render();
};
UI.changes['scn.oo'] = (d, el) => {
  const oo = UI.state.scnDraft.overrides.oneOffs[Number(d.i)];
  if (!oo) return;
  oo[d.k] = d.k === 'label' ? el.value : toNum(el.value, 0);
  render();
};

/* ============================ HEALTH ============================ */
Views.health = function(){
  const h = Calc.health();
  const acts = Calc.nextActions();
  const lvl = h.total >= 75 ? 'good' : h.total >= 50 ? 'warn' : 'crit';
  const prioPill = p => p === 'high' ? '<span class="pill crit">High priority</span>' : p === 'medium' ? '<span class="pill warn">Medium</span>' : '<span class="pill neutral">Low</span>';

  let html = pageHead('Financial health',
    'A transparent, configurable self-assessment — every number shows its working. It is <strong>not</strong> a credit score, and none of this is regulated financial advice.');

  html += '<div class="grid g13">';
  html += '<div class="card"><div class="score-hero">' +
    '<div><div class="score-num num">' + h.total + '<span class="of"> / 100</span></div>' +
    '<div class="meter ' + lvl + '" style="width:170px"><div class="meter-track"><div class="meter-fill" style="width:' + h.total + '%"></div></div></div></div>' +
    '<div class="small muted" style="max-width:220px">Weighted sum of the ten categories below. Adjust the targets that drive it in <button class="link-btn" data-action="nav" data-route="settings">Settings</button>.</div>' +
    '</div></div>';

function calendarEvents(fromISO, toISO){
  const out = [];
  const excl = UI.state.calFilters;
  const add = (date, title, type, extra) => {
    if (excl[type]) return;
    out.push(Object.assign({ date, title, type, color: (EVENT_TYPES[type] || EVENT_TYPES.other).color }, extra || {}));
  };
  for (const e of DB.events){
    const freq = !e.recurring || e.recurring === 'none' ? 'once' : e.recurring;
    for (const iso of Calc.occurrences({ frequency: freq, startDate: e.date, endDate: null }, fromISO, toISO)){
      add(iso, e.title, e.type || 'other', { src: 'event', refId: e.id, done: !!e.done });
    }
  }
  for (const it of DB.scheduled){
    const type = it.type === 'income' ? 'payday' : 'payment';
    for (const iso of Calc.occurrences(it, fromISO, toISO)){
      add(iso, it.name, type, { src: 'scheduled', refId: it.id, amt: toBase(it.amount, it.currency) * (it.type === 'income' ? 1 : -1), transfer: it.type === 'transfer' });
    }
  }
  for (const g of DB.goals){
    if (g.targetDate && g.targetDate >= fromISO && g.targetDate <= toISO) add(g.targetDate, g.name + ' — target date', 'goal', { src: 'goal', refId: g.id });
  }
  for (const dc of DB.documents){
    if (dc.expiryDate && dc.expiryDate >= fromISO && dc.expiryDate <= toISO) add(dc.expiryDate, dc.name + ' — renewal/expiry', 'document', { src: 'document', refId: dc.id });
  }
  out.sort((a, b) => a.date < b.date ? -1 : 1);
  return out;
}

Views.calendar = function(){

  let html = pageHead('Financial calendar',

    '<button class="btn btn-primary" data-action="evt.add">' + icon('plus', 14) + ' Add event</button>');

  html += '<div class="spread mb12"><div class="row">' +
    '<button class="icon-btn" data-action="cal.month" data-d="-1" aria-label="Previous month">' + icon('chevl') + '</button>' +
    '<span class="b" style="min-width:120px;text-align:center">' + monthLabel(mk) + '</span>' +
    '<button class="icon-btn" data-action="cal.month" data-d="1" aria-label="Next month">' + icon('chevr') + '</button>' +

    '<button class="chip" data-action="cal.filter" data-t="' + k + '" aria-pressed="' + (!UI.state.calFilters[k]) + '">' +
    '<span class="dot" style="background:' + v.color + '"></span>' + v.label + '</button>').join('') + '</div>';

  if (mode === 'month'){
    const first = parseISO(monthStartISO(mk));
    const startDow = first.getDay();
    const gridStart = addDaysISO(monthStartISO(mk), -startDow);
    const events = calendarEvents(gridStart, addDaysISO(gridStart, 41));
    const byDay = groupBy(events, e => e.date);
    const today = todayISO();
    html += '<div class="card"><div class="cal-grid" role="grid" aria-label="Calendar for ' + monthLabel(mk) + '">' +
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => '<div class="cal-dow">' + d + '</div>').join('');
    for (let i = 0; i < 42; i++){
      const iso = addDaysISO(gridStart, i);
      const inMonth = monthKey(iso) === mk;
      const evs = byDay.get(iso) || [];
      html += '<div class="cal-cell' + (inMonth ? '' : ' dim') + (iso === today ? ' today' : '') + '" role="gridcell">' +
        '<button class="cal-date link-btn" style="color:inherit;font-weight:600" data-action="evt.add" data-date="' + iso + '" aria-label="Add event on ' + fmtDate(iso) + '">' + parseISO(iso).getDate() + '</button>' +
        evs.slice(0, 3).map(e =>
          '<button class="cal-evt' + (e.done ? ' done' : '') + '" data-action="cal.open" data-src="' + e.src + '" data-id="' + e.refId + '" title="' + esc(e.title) + '">' +
          '<span class="dot" style="background:' + e.color + '"></span><span class="t">' + esc(e.title) + '</span></button>').join('') +
        (evs.length > 3 ? '<span class="cal-more">+' + (evs.length - 3) + ' more</span>' : '') +
        '</div>';
    }
    html += '</div></div>';
  } else {
    const from = todayISO();
    const events = calendarEvents(from, addDaysISO(from, 60));
    const byDay = groupBy(events, e => e.date);
    html += '<div class="card">';
    if (!events.length) html += emptyState('calendar', 'Nothing in the next 60 days.');
    for (const [iso, evs] of byDay){
      html += '<div class="agenda-day"><div class="agenda-date">' + fmtDate(iso) + ' <span class="rel">' + relativeDay(iso) + '</span></div>' +
        evs.map(e => '<div class="evt-row' + (e.done ? ' done' : '') + '"><span class="dot" style="background:' + e.color + '"></span>' +
          '<button class="link-btn evt-t" style="color:inherit;text-align:left" data-action="cal.open" data-src="' + e.src + '" data-id="' + e.refId + '">' + esc(e.title) +
          (e.transfer ? ' <span class="tag">transfer</span>' : '') + '</button>' +
          (e.amt != null ? '<span class="evt-amt num ' + (e.amt > 0 ? 'pos' : '') + '">' + fmtMoney(e.amt, null, { sign: true }) + '</span>' : '') +
          (e.src === 'event' ? '<button class="icon-btn" data-action="evt.done" data-id="' + e.refId + '" title="Mark done" aria-label="Mark ' + esc(e.title) + ' done">' + icon('check', 14) + '</button>' : '') +
          '</div>').join('') + '</div>';
    }
    html += '</div>';
  }
  return html;
};

    '<div class="row mb12">' +
    '<button class="btn" data-action="data.resetsample">' + icon('repeat', 14) + ' Reset sample data</button>' +
    '<button class="btn btn-danger" data-action="data.deleteall">' + icon('trash', 14) + ' Delete all financial data</button>' +
    '</div>' +
    '<div class="note">Storage: ' + (storageOK ? 'browser localStorage (persists across sessions on this device)' : '<span class="warn-ink">unavailable — in-memory only, export a backup!</span>') +
    ' · Records: ' + DB.accounts.length + ' accounts, ' + DB.transactions.length + ' transactions · v' + APP_VERSION + '</div>' +
    '</div>';

  html += '<div class="card"><div class="card-head"><div class="card-title">Privacy & scope</div></div>' + PRIVACY_HTML + '</div>';
  html += '</div>';
  return html;
};
UI.changes['set.txt'] = (d, el) => {
  DB.settings[d.k] = d.k === 'fyStartMonth' ? toNum(el.value, 1) : el.value;
  save(); render();
};
UI.changes['set.num'] = (d, el) => { DB.settings[d.k] = toNum(el.value, null); save(); render(); };
UI.changes['set.split'] = (d, el) => { DB.settings.modelSplit[d.k] = toNum(el.value, 0); save(); render(); };
UI.actions['set.theme'] = d => { DB.settings.theme = d.v; save(); applyTheme(); render(); };
UI.changes['fx.set'] = (d, el) => {
  const v = toNum(el.value, null);
  if (v == null || v <= 0){ toast('Enter a positive rate'); return; }
  DB.fx.rates[d.cur] = { rate: v * fxRate(DB.settings.baseCurrency), date: todayISO() };
  save(); render();
  toast('Rate updated (manual)');
};
UI.actions['data.export'] = () => exportJSON();
UI.changes['data.import'] = (d, el) => {
  const f = el.files && el.files[0];
  if (f) importJSONFile(f);
  el.value = '';
};
UI.actions['data.resetsample'] = async () => {
  const ok = await confirmDialog({
    title: 'Reset to sample data?',
    message: 'This replaces <strong>all current data</strong> with the fictional Carter-household demonstration data.',
    confirmLabel: 'Reset to sample', danger: true
  });
  if (!ok) return;
  DB = sampleData(); DB.meta.onboarded = true;
  save(); applyTheme(); render();
  toast('Sample data restored');
};
UI.actions['data.deleteall'] = async () => {
  const ok = await confirmDialog({
    title: 'Delete all financial data?',
    message: 'This permanently removes every account, transaction, goal, scenario and document from this browser. <strong>There is no undo.</strong>',
    detail: 'Consider exporting a JSON backup first.',
    confirmLabel: 'Delete everything', danger: true
  });
  if (!ok) return;
  const ok2 = await confirmDialog({
    title: 'Really delete everything?',
    message: 'Last check — the app will restart empty.',
    confirmLabel: 'Yes, delete it all', danger: true
  });
  if (!ok2) return;
  storageClear();
  DB = blankData(); DB.meta.onboarded = true;
  save(); applyTheme(); render();
  toast('All data deleted — starting fresh');
};

/* ====================== onboarding & privacy ====================== */
function onboardingModal(){
  const dlg = modal({
    title: 'Welcome to Northstar Finance', wide: true, blockOverlayClose: true,
    body:
      '<p style="font-size:13.5px">Your household financial operating system: net worth, cash flow, budgets, goals, forecasts and what-if scenarios — in one private page.</p>' +
      '<ul style="padding-left:18px;font-size:13px;display:grid;gap:6px">' +
      '<li><strong>Local-first.</strong> Everything stays in this browser. Export JSON backups from Settings.</li>' +
      '<li><strong>Balances are yours to update.</strong> Accounts hold the truth; transactions power the analytics — nothing double-counts.</li>' +
      '<li><strong>Planning aid, not advice.</strong> Insights are rule-based and transparent.</li></ul>' +
      '<div class="info-note mt8">' + icon('info') + '<div>The app is pre-loaded with a <strong>fictional demonstration household</strong> (the Carters) so every screen has something to show. Explore it, then reset when you’re ready — or start empty now.</div></div>',
    foot: '<button class="btn" data-fresh>Start fresh (empty)</button>' +
          '<button class="btn btn-primary" data-demo>Explore the demo</button>'
  });
  dlg.querySelector('[data-demo]').addEventListener('click', () => {
    DB.meta.onboarded = true; save(); closeModal();
  });
  dlg.querySelector('[data-fresh]').addEventListener('click', () => {
    DB = blankData(); DB.meta.onboarded = true;
    save(); applyTheme(); closeModal(); render();
    toast('Starting fresh — add your first account');
    navigate('accounts');
  });
}
UI.actions['privacy'] = () => {
  const dlg = modal({ title: 'Privacy & scope', body: PRIVACY_HTML, foot: '<button class="btn btn-primary" data-ok>Got it</button>' });
  dlg.querySelector('[data-ok]').addEventListener('click', closeModal);
};

/* ============================ 7. BOOT ============================ */
function boot(){
  Tip.el = document.getElementById('tip');
  loadDB();
  applyTheme();
  const m = /^#\/([a-z]+)/.exec(location.hash);
  if (m && ROUTES.some(r => r.id === m[1])) UI.state.route = m[1];
  document.getElementById('menuBtn').setAttribute('data-action', 'menu');
  document.getElementById('themeBtn').setAttribute('data-action', 'theme.cycle');
  document.getElementById('privacyBtn').setAttribute('data-action', 'privacy');
  document.getElementById('sideBackdrop').addEventListener('click', () => {
    document.getElementById('app').classList.remove('nav-open');
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  });
  window.addEventListener('hashchange', () => {
    const mm = /^#\/([a-z]+)/.exec(location.hash);
    if (mm && ROUTES.some(r => r.id === mm[1]) && mm[1] !== UI.state.route) navigate(mm[1]);
  });
  try {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => { if ((DB.settings.theme || 'auto') === 'auto') render(); });
  } catch (e) { /* older browsers */ }
  render();
  if (!DB.meta.onboarded) onboardingModal();
}

/* console API for tinkering & extension */
window.NS = {
  version: APP_VERSION,
  db: () => DB,
  save, render, calc: Calc, chart: Chart,
  exportJSON: () => JSON.stringify(DB),
  importJSON: str => { DB = migrate(JSON.parse(str)); save(); render(); },
  resetSample: () => { DB = sampleData(); DB.meta.onboarded = true; save(); render(); },
  blank: () => { DB = blankData(); DB.meta.onboarded = true; save(); render(); }
};

boot();
</script>

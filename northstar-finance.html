<!DOCTYPE html>
<!--
  NORTHSTAR FINANCE — Your household financial operating system
  Single-file, local-first personal finance application. Version 1.0
  No server, no build step, no external dependencies. All data lives in
  this browser's localStorage. Open this file in any modern browser.
  All pre-loaded figures are fictional demonstration data.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Northstar Finance — a private, local-first household financial operating system. Net worth, cash flow, goals, forecasts and scenarios in one file.">
<title>Northstar Finance</title>
<style>
/* ============================================================
   NORTHSTAR FINANCE — design tokens
   Light is the default; dark applies via OS preference or the
   in-app toggle (data-theme on <html>), and the toggle wins.
   Chart series colors are a validated colorblind-safe palette.
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f5f4f1;
  --surface:#fcfcfb;
  --surface-2:#f5f4ef;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --line:rgba(11,11,11,.10);
  --hairline:rgba(11,11,11,.065);
  --grid:#e7e6df;
  --axis:#c3c2b7;
  --accent:#1c5cab;
  --accent-strong:#164a8c;
  --accent-wash:rgba(28,92,171,.09);
  --link:#1c5cab;
  --pos:#006300;
  --neg:#b3261e;
  --warn-text:#8a5a00;
  --pos-wash:rgba(12,163,12,.10);
  --neg-wash:rgba(208,59,59,.10);
  --warn-wash:rgba(250,178,25,.14);
  --st-good:#0ca30c;
  --st-warn:#fab219;
  --st-serious:#ec835a;
  --st-crit:#d03b3b;
  --st-good-text:#006300;
  --st-warn-text:#8a5a00;
  --st-serious-text:#95431c;
  --st-crit-text:#b3261e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --spark:#b9b7ae;
  --tip-bg:#26251f;
  --tip-ink:#fbfaf6;
  --tip-muted:#b5b3a8;
  --shadow-1:0 1px 2px rgba(24,22,14,.06);
  --shadow-2:0 2px 6px rgba(24,22,14,.06),0 16px 40px -18px rgba(24,22,14,.22);
  --danger:#b3261e;
  --danger-strong:#951f18;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-brand:"Iowan Old Style","Palatino Linotype",Charter,Georgia,serif;
  --r-card:10px; --r-ctl:8px; --r-sm:6px;
  --side-w:236px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --ink:#f4f3ee;
    --ink-2:#c3c2b7;
    --muted:#898781;
    --line:rgba(255,255,255,.12);
    --hairline:rgba(255,255,255,.07);
    --grid:#2c2c2a;
    --axis:#383835;
    --accent:#256abf;
    --accent-strong:#2a78d6;
    --accent-wash:rgba(57,135,229,.16);
    --link:#6da7ec;
    --pos:#0ca30c;
    --neg:#e66767;
    --warn-text:#fab219;
    --pos-wash:rgba(12,163,12,.16);
    --neg-wash:rgba(230,103,103,.14);
    --warn-wash:rgba(250,178,25,.12);
    --st-good-text:#34c759;
    --st-warn-text:#fab219;
    --st-serious-text:#ec835a;
    --st-crit-text:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --spark:#575651;
    --tip-bg:#f4f3ee;
    --tip-ink:#161614;
    --tip-muted:#52514e;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 8px rgba(0,0,0,.5),0 18px 48px -18px rgba(0,0,0,.7);
    --danger:#d03b3b;
    --danger-strong:#e05555;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0d0d;
  --surface:#1a1a19;
  --surface-2:#232322;
  --ink:#f4f3ee;
  --ink-2:#c3c2b7;
  --muted:#898781;
  --line:rgba(255,255,255,.12);
  --hairline:rgba(255,255,255,.07);
  --grid:#2c2c2a;
  --axis:#383835;
  --accent:#256abf;
  --accent-strong:#2a78d6;
  --accent-wash:rgba(57,135,229,.16);
  --link:#6da7ec;
  --pos:#0ca30c;
  --neg:#e66767;
  --warn-text:#fab219;
  --pos-wash:rgba(12,163,12,.16);
  --neg-wash:rgba(230,103,103,.14);
  --warn-wash:rgba(250,178,25,.12);
  --st-good-text:#34c759;
  --st-warn-text:#fab219;
  --st-serious-text:#ec835a;
  --st-crit-text:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --spark:#575651;
  --tip-bg:#f4f3ee;
  --tip-ink:#161614;
  --tip-muted:#52514e;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 8px rgba(0,0,0,.5),0 18px 48px -18px rgba(0,0,0,.7);
  --danger:#d03b3b;
  --danger-strong:#e05555;
}

/* ============ reset & base ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0; font-weight:600; line-height:1.25}
p{margin:0 0 .6em}
a{color:var(--link); text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit; color:inherit}
svg{display:block}
[hidden]{display:none !important}
::selection{background:var(--accent); color:#fff}
:focus-visible{outline:2px solid var(--accent-strong); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important; animation:none !important}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute; left:8px; top:-90px; z-index:200; background:var(--surface); color:var(--ink);
  padding:8px 14px; border-radius:8px; transition:top .15s}
.skip:focus{top:8px; box-shadow:var(--shadow-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px; border:2px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ app layout ============ */
.app{display:flex; min-height:100vh}
.side{
  width:var(--side-w); flex:0 0 var(--side-w);
  position:sticky; top:0; align-self:flex-start; height:100vh;
  display:flex; flex-direction:column;
  background:var(--surface); border-right:1px solid var(--hairline);
  padding:18px 12px 14px; z-index:60;
}
.body{flex:1; min-width:0; display:flex; flex-direction:column}
.main{flex:1; width:100%; max-width:1260px; margin:0 auto; padding:20px 28px 96px}
.main:focus{outline:none}

/* brand */
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 16px}
.brand-mark{width:30px;height:30px; border-radius:8px; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; flex:0 0 30px}
.brand-name{font-family:var(--font-brand); font-size:19px; font-weight:600; letter-spacing:.01em; line-height:1.1}
.brand-sub{font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-top:2px}

/* nav */
.side nav{flex:1; overflow-y:auto; padding:2px 0}
.nav-group-label{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  padding:14px 10px 5px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:7px 10px; margin:1px 0; border:0; background:none; text-align:left;
  border-radius:8px; color:var(--ink-2); cursor:pointer; font-size:13.5px; font-weight:500;
}
.nav-item svg{width:17px;height:17px; flex:0 0 17px; opacity:.85}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-wash); color:var(--ink); font-weight:600}
.nav-item[aria-current="page"] svg{color:var(--accent-strong); opacity:1}
.side-foot{border-top:1px solid var(--hairline); padding:10px 6px 0; display:flex; flex-direction:column; gap:8px}
.side-note{font-size:11px; color:var(--muted); line-height:1.45; padding:0 4px}
.side-backdrop{position:fixed; inset:0; background:rgba(10,10,8,.45); z-index:55; opacity:0; pointer-events:none; transition:opacity .18s}

/* topbar */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:12px;
  padding:10px 28px; background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hairline);
}
.top-title{font-size:15px; font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .menu-btn{display:none}

/* segmented control */
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--hairline); border-radius:9px; padding:2px; gap:2px}
.seg button{
  border:0; background:none; padding:4px 11px; border-radius:7px; cursor:pointer;
  font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--shadow-1)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.seg.seg-sm button{padding:3px 9px; font-size:12px}

/* ============ banner ============ */
.banner{
  display:flex; align-items:flex-start; gap:10px;
  margin:16px 28px 0; padding:10px 14px;
  background:var(--warn-wash); border:1px solid color-mix(in srgb, var(--st-warn) 35%, transparent);
  border-radius:10px; font-size:13px;
}
.banner.info{background:var(--accent-wash); border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
.banner svg{width:16px;height:16px; flex:0 0 16px; margin-top:2px}
.banner .banner-body{flex:1}
.banner .banner-close{margin-left:auto}

/* ============ page & cards ============ */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:6px 0 18px}
.page-title{font-size:22px; font-weight:650; letter-spacing:-.01em}
.page-sub{color:var(--ink-2); font-size:13px; margin-top:3px; max-width:640px}
.page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.card{
  background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-card);
  box-shadow:var(--shadow-1); padding:16px 18px; min-width:0;
}
.card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap}
.card-title{font-size:13.5px; font-weight:600}
.card-sub{font-size:12px; color:var(--muted)}
.card-actions{display:flex; gap:6px; align-items:center}
.section-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:26px 0 10px}
.grid{display:grid; gap:14px; margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g13{grid-template-columns:1fr 2fr}
.divider{border:0; border-top:1px solid var(--hairline); margin:14px 0}

/* ============ KPI tiles ============ */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:14px}
.kpi{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-card); box-shadow:var(--shadow-1); padding:13px 15px; min-width:0}
.kpi-label{font-size:11.5px; color:var(--muted); font-weight:550; display:flex; align-items:center; gap:5px}
.kpi-value{font-size:23px; font-weight:650; letter-spacing:-.01em; margin-top:3px; white-space:nowrap}
.kpi-value.hero{font-size:32px}
.kpi-delta{font-size:12px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums}
.kpi-delta .vs{color:var(--muted); font-weight:450}
.kpi-note{font-size:11.5px; color:var(--muted); margin-top:2px}
.kpi-spark{margin-top:8px}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.warn-ink{color:var(--warn-text)}

/* meter */
.meter{margin-top:8px}
.meter-track{height:6px; border-radius:4px; background:color-mix(in srgb, var(--accent) 16%, var(--surface-2)); overflow:hidden}
.meter-fill{height:100%; border-radius:4px; background:var(--accent); min-width:2px}
.meter.good .meter-track{background:color-mix(in srgb, var(--st-good) 15%, var(--surface-2))}
.meter.good .meter-fill{background:var(--st-good)}
.meter.warn .meter-track{background:color-mix(in srgb, var(--st-warn) 18%, var(--surface-2))}
.meter.warn .meter-fill{background:var(--st-warn)}
.meter.crit .meter-track{background:color-mix(in srgb, var(--st-crit) 15%, var(--surface-2))}
.meter.crit .meter-fill{background:var(--st-crit)}
.meter-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:4px}

/* ============ buttons ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:6px 13px; border-radius:var(--r-ctl); cursor:pointer;
  font-size:13px; font-weight:550; line-height:1.4; white-space:nowrap;
  transition:background .12s, border-color .12s;
}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong)}
.btn-danger{background:none; border-color:color-mix(in srgb, var(--danger) 45%, transparent); color:var(--st-crit-text)}
.btn-danger:hover{background:var(--neg-wash)}
.btn-danger.solid{background:var(--danger); border-color:var(--danger); color:#fff}
.btn-danger.solid:hover{background:var(--danger-strong)}
.btn-ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn-sm{padding:4px 10px; font-size:12.5px; border-radius:7px}
.btn-sm svg{width:13px;height:13px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:8px; border:1px solid transparent;
  background:none; cursor:pointer; color:var(--ink-2); flex:0 0 auto;
}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}
.link-btn{border:0;background:none;padding:0;color:var(--link);cursor:pointer;font-size:inherit;font-weight:550}
.link-btn:hover{text-decoration:underline}

/* ============ chips, pills, tags ============ */
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:3px 11px; font-size:12px; font-weight:500; color:var(--ink-2); cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent-wash); border-color:color-mix(in srgb, var(--accent) 45%, transparent); color:var(--ink); font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%}
.tag{display:inline-flex; align-items:center; background:var(--surface-2); border-radius:5px; padding:1px 7px; font-size:11px; color:var(--ink-2); font-weight:500}
.pill{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:600}
.pill svg{width:11px;height:11px}
.pill.good{background:var(--pos-wash); color:var(--st-good-text)}
.pill.warn{background:var(--warn-wash); color:var(--st-warn-text)}
.pill.serious{background:color-mix(in srgb, var(--st-serious) 14%, transparent); color:var(--st-serious-text)}
.pill.crit{background:var(--neg-wash); color:var(--st-crit-text)}
.pill.neutral{background:var(--surface-2); color:var(--ink-2)}
.owner-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}

/* ============ tables ============ */
.tbl-wrap{overflow-x:auto; margin:0 -18px; padding:0 18px}
table.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th{
  text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); font-weight:600; padding:7px 10px; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.tbl th.sortable{cursor:pointer; user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .sort-ind{font-size:9px; margin-left:3px}
.tbl td{padding:8px 10px; border-bottom:1px solid var(--hairline); vertical-align:middle}
.tbl tbody tr:hover{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num, .num{font-variant-numeric:tabular-nums}
.tbl td.num, .tbl th.num{text-align:right}
.cell-main{font-weight:550}
.cell-sub{font-size:11.5px; color:var(--muted); margin-top:1px}
.row-actions{display:flex; gap:2px; justify-content:flex-end; opacity:.35; transition:opacity .12s}
tr:hover .row-actions, .row-actions:focus-within{opacity:1}
.tbl tfoot td{font-weight:650; border-top:1px solid var(--line); border-bottom:0; padding-top:9px}
.tbl-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.arch{opacity:.55}

/* ============ forms ============ */
.form{display:flex; flex-direction:column; gap:13px}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.frow.f3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field>label{font-size:12px; font-weight:600; color:var(--ink-2)}
.field .req{color:var(--st-crit-text)}
.input{
  width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:var(--r-ctl); padding:7px 10px; font-size:13.5px; font-family:inherit;
}
.input:focus{outline:2px solid var(--accent-strong); outline-offset:-1px; border-color:transparent}
.input.err{border-color:var(--st-crit); outline-color:var(--st-crit)}
textarea.input{resize:vertical; min-height:58px}
select.input{appearance:auto; padding-right:6px}
.field-err{font-size:11.5px; color:var(--st-crit-text); font-weight:550}
.hint{font-size:11.5px; color:var(--muted); line-height:1.45}
.check{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; color:var(--ink-2)}
.check input{width:15px;height:15px; accent-color:var(--accent); margin:0; cursor:pointer}
.check-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px 14px}
.input-row{display:flex; gap:8px; align-items:center}
fieldset{border:1px solid var(--hairline); border-radius:var(--r-ctl); padding:12px 14px; margin:0}
legend{font-size:12px; font-weight:600; color:var(--ink-2); padding:0 6px}

/* ============ modal ============ */
.overlay{
  position:fixed; inset:0; z-index:100; display:flex; align-items:flex-start; justify-content:center;
  padding:5vh 16px 16px; background:rgba(12,12,10,.46); overflow-y:auto;
  animation:fadein .14s ease;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface); border:1px solid var(--hairline); border-radius:14px;
  width:100%; max-width:560px; box-shadow:var(--shadow-2);
  display:flex; flex-direction:column; max-height:90vh;
  animation:pop .16s ease;
}
@keyframes pop{from{transform:translateY(6px); opacity:.6}to{transform:none; opacity:1}}
.modal.wide{max-width:760px}
.modal-head{display:flex; align-items:center; gap:10px; padding:15px 20px 0}
.modal-title{font-size:16px; font-weight:650; flex:1}
.modal-body{padding:14px 20px 6px; overflow-y:auto}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; align-items:center; padding:14px 20px 16px; flex-wrap:wrap}
.modal-foot .left{margin-right:auto}

/* ============ toast ============ */
.toast-root{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:150; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  pointer-events:auto; display:flex; align-items:center; gap:12px;
  background:var(--tip-bg); color:var(--tip-ink);
  border-radius:10px; padding:9px 16px; font-size:13px; font-weight:500;

}
.toast .link-btn{color:inherit; text-decoration:underline; font-weight:650}

/* ============ chart chrome ============ */
.chart{position:relative; min-width:0}

.tip-key.sw{width:8px; height:8px; border:0; border-radius:2px; flex-basis:8px}
.tip-lab{color:var(--tip-muted); flex:1; padding-right:8px}
.tip-val{font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap}
.chart-tblwrap{overflow-x:auto; max-height:300px; overflow-y:auto; margin-top:8px; border:1px solid var(--hairline); border-radius:8px}

/* ============ briefing / actions / insight lists ============ */
.brief-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline); font-size:13px; line-height:1.5}
.brief-item:last-child{border-bottom:0}
.brief-item .b-ico{flex:0 0 18px; width:18px; height:18px; margin-top:1px}
.brief-item strong{font-weight:650}
.action-item{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--hairline); align-items:flex-start}
.action-item:last-child{border-bottom:0}
.action-rank{flex:0 0 24px; height:24px; border-radius:7px; background:var(--surface-2); color:var(--ink-2); font-size:12px; font-weight:650; display:flex; align-items:center; justify-content:center; margin-top:1px}

.action-title{font-weight:600; font-size:13.5px}
.action-why{font-size:12.5px; color:var(--ink-2); margin-top:2px}

}

.hc-score{font-variant-numeric:tabular-nums; font-weight:650; font-size:13px; width:52px; text-align:right}
.hc-bar{flex:2; min-width:90px}
.hc-detail{padding:2px 2px 12px; font-size:13px; color:var(--ink-2); display:grid; gap:6px}

<script>
'use strict';
/* ================================================================
   NORTHSTAR FINANCE — developer notes
   ----------------------------------------------------------------
   ARCHITECTURE. One vanilla-JS application, no dependencies. The
   code is organised in ordered sections within this single script:
     1. CORE      — utilities, formatting, storage, currency (fx)
     2. DATA      — blankData(), sampleData(), migration
     3. CALC      — every financial calculation, pure functions in
                    the `Calc` namespace (aggregations, cash-flow
                    projection, goal maths, forecast engine,
                    scenario runner, health score, insights)
     4. CHARTS    — a small SVG chart library in `Chart`
                    (line, columns, hbars, donut, sparkline),
                    theme-aware, with tooltips and a table twin
     5. UI        — router, modals, toasts/undo, form builder,
                    tables, CSV import/export in `UI`
     6. VIEWS     — one render function per section in `Views`
     7. BOOT      — init, onboarding, event delegation

   MAJOR DATA OBJECTS (the single `DB` object, persisted whole):
     DB.settings   profile, base currency, formats, targets, theme
     DB.fx         manual exchange rates (1 unit -> USD pivot) + dates
     DB.accounts   assets & liabilities (balances are authoritative
                   and updated manually or via balance history)
     DB.balances   dated balance-history entries per account
     DB.transactions  ledger for analytics (income/spending/etc.);
                   transactions do NOT auto-change account balances —
                   this avoids double counting; balances stay manual
     DB.categories spending/income categories with group flags
     DB.budgets    monthly target per category (+rollover flag)
     DB.goals      life goals, optionally linked to an account
     DB.scheduled  future recurring cash flows (paydays, bills…)
     DB.events     financial-calendar events
     DB.documents  document register (metadata only, no files)
     DB.scenarios  saved what-if scenarios (never mutate real data)
     DB.forecast   long-term assumptions: three cases + major expenses

   WHERE DATA IS STORED. localStorage under key 'northstar.finance.v1'
   as one JSON blob, written by save() after every mutation. If
   localStorage is unavailable the app falls back to in-memory
   storage and shows a warning. Export/Import JSON moves the whole
   DB. IDs are stable strings from uid().

   HOW CALCULATIONS ARE ORGANISED. Everything numeric lives in
   `Calc.*` as pure functions of (DB, args) so every screen
   reconciles: Calc.toBase() converts currency, Calc.netWorth(),
   Calc.monthStats() (transfers excluded by design),
   Calc.projectCashflow(), Calc.goalMath(), Calc.runForecast(),
   Calc.health(), Calc.insights(). Views never re-implement maths.

   HOW TO EXTEND. Add a route in ROUTES + a Views.<name>() renderer;
   add fields by extending blankData()/migrate(); add a calculation
   in Calc; charts via Chart.line/columns/hbars/donut. A console API
   is exposed at window.NS  (NS.db(), NS.save(), NS.calc, …).
   ================================================================ */

/* ============================ 1. CORE ============================ */

const LS_KEY = 'northstar.finance.v1';
const APP_VERSION = '1.0.0';

/* ---- tiny utilities ---- */
const $  = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

function uid(p){ return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
function round2(v){ return Math.round((v + Number.EPSILON) * 100) / 100; }
function sum(arr, fn){ let t = 0; for (const x of arr) t += fn ? fn(x) : x; return t; }
function sortBy(arr, fn, desc){
  return arr.slice().sort((a, b) => {
    const va = fn(a), vb = fn(b);
    if (va < vb) return desc ? 1 : -1;
    if (va > vb) return desc ? -1 : 1;
    return 0;
  });
}
function groupBy(arr, fn){
  const m = new Map();
  for (const x of arr){ const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function isNum(v){ return typeof v === 'number' && isFinite(v); }
function toNum(v, fallback){
  if (v === '' || v == null) return fallback;
  const n = Number(String(v).replace(/[,\s]/g, ''));
  return isFinite(n) ? n : fallback;
}

/* deterministic RNG for sample data */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- dates (local, ISO strings YYYY-MM-DD everywhere) ---- */
function pad2(n){ return String(n).padStart(2, '0'); }
function dateToISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s){
  if (s instanceof Date) return new Date(s.getFullYear(), s.getMonth(), s.getDate());
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
function todayISO(){ return dateToISO(new Date()); }
function addDaysISO(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return dateToISO(d); }
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); } // m = 1..12
function addMonthsISO(iso, n){
  const d = parseISO(iso);
  const day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(day, daysInMonth(t.getFullYear(), t.getMonth() + 1)));
  return dateToISO(t);
}
function diffDays(aISO, bISO){ // b - a in days
  return Math.round((parseISO(bISO) - parseISO(aISO)) / 86400000);
}
function monthKey(iso){ return String(iso).slice(0, 7); }              // 'YYYY-MM'
function monthStartISO(key){ return key + '-01'; }
function monthEndISO(key){
  const [y, m] = key.split('-').map(Number);
  return key + '-' + pad2(daysInMonth(y, m));
}
function shiftMonthKey(key, n){
  const [y, m] = key.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  return t.getFullYear() + '-' + pad2(t.getMonth() + 1);
}
function monthLabel(key, short){
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString(undefined, short ? { month: 'short' } : { month: 'short', year: 'numeric' });
}
function relativeDay(iso){
  const n = diffDays(todayISO(), iso);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n > 1) return 'in ' + n + ' days';
  return Math.abs(n) + ' days ago';
}

/* ---- formatting (respects DB.settings) ---- */
const _nfCache = {};
function _nf(key, make){ return _nfCache[key] || (_nfCache[key] = make()); }

function fmtMoney(v, currency, opts){
  opts = opts || {};
  const cur = currency || DB.settings.baseCurrency;
  const decimals = opts.decimals != null ? opts.decimals : (Math.abs(v) >= 1000 ? 0 : 2);
  const neg = v < -0.004;
  if (opts.compact){
    const nf = _nf('c_' + cur, () => new Intl.NumberFormat('en-US', { style: 'currency', currency: cur, notation: 'compact', maximumFractionDigits: 1 }));
    return nf.format(v);
  }
  const nf = _nf(cur + '_' + decimals, () => new Intl.NumberFormat('en-US', { style: 'currency', currency: cur, minimumFractionDigits: decimals, maximumFractionDigits: decimals }));
  let out = nf.format(Math.abs(v) < 0.005 ? 0 : v);
  if (opts.sign && v > 0.004) out = '+' + out;
  return out;
}
function fmtPct(v, dp){ return (isFinite(v) ? v.toFixed(dp != null ? dp : 1) : '—') + '%'; }
function fmtNum(v, dp){
  const nf = _nf('n' + (dp || 0), () => new Intl.NumberFormat('en-US', { maximumFractionDigits: dp || 0 }));
  return nf.format(v);
}
function fmtDate(iso, opts){
  if (!iso) return '—';
  const d = parseISO(iso);
  if (!d) return '—';
  const f = DB.settings.dateFormat;
  if (opts && opts.short){
    return d.toLocaleDateString(f === 'DMY' ? 'en-GB' : 'en-US', { day: 'numeric', month: 'short' });
  }
  if (f === 'ISO') return dateToISO(d);
  const locale = f === 'DMY' ? 'en-GB' : 'en-US';
  return d.toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' });
}
function signClass(v){ return v > 0.004 ? 'pos' : (v < -0.004 ? 'neg' : ''); }

/* ---- CSV ---- */
function csvParse(text){
  const rows = []; let row = [], cell = '', inQ = false;
  const s = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (inQ){
      if (ch === '"'){
        if (s[i + 1] === '"'){ cell += '"'; i++; } else inQ = false;
      } else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ','){ row.push(cell); cell = ''; }
    else if (ch === '\n'){ row.push(cell); cell = ''; if (row.some(c => c.trim() !== '')) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell);
  if (row.some(c => c.trim() !== '')) rows.push(row);
  return rows;
}
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvSerialize(rows){ return rows.map(r => r.map(csvCell).join(',')).join('\n'); }
function download(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

/* Merge stored data over a blank skeleton so new fields appear after upgrades. */
function migrate(raw){
  const base = blankData();
  if (!raw || typeof raw !== 'object') return base;
  const out = base;
  for (const k of ['meta', 'settings', 'fx', 'forecast']){
    if (raw[k] && typeof raw[k] === 'object'){
      out[k] = Object.assign({}, base[k], raw[k]);
    }
  }
  out.settings.modelSplit = Object.assign({}, base.settings.modelSplit, (raw.settings || {}).modelSplit || {});
  out.fx.rates = Object.assign({}, base.fx.rates, (raw.fx || {}).rates || {});
  out.forecast.cases = Object.assign({}, base.forecast.cases, (raw.forecast || {}).cases || {});
  if (!Array.isArray(out.forecast.majorExpenses)) out.forecast.majorExpenses = [];
  for (const k of ['accounts', 'balances', 'transactions', 'categories', 'goals', 'scheduled', 'events', 'documents', 'scenarios']){
    out[k] = Array.isArray(raw[k]) ? raw[k] : base[k];
  }
  out.budgets = (raw.budgets && typeof raw.budgets === 'object') ? raw.budgets : {};
  if (!out.categories.length) out.categories = defaultCategories();
  out.schema = 1;
  return out;
}

function loadDB(){
  const raw = storageGet();
  if (!raw){ DB = sampleData(); save(); return; }
  try { DB = migrate(JSON.parse(raw)); }
  catch (e) { console.warn('Northstar: stored data unreadable, starting fresh.', e); DB = sampleData(); }
}

/* ============================ 3. CALC ============================
   Pure(ish) financial calculations. Everything reads DB and returns
   plain data; no DOM. Views must use these so screens reconcile.   */
const Calc = {

  /* ---- lookups ---- */
  account(id){ return DB.accounts.find(a => a.id === id) || null; },
  category(id){ return DB.categories.find(c => c.id === id) || null; },
  catName(id){ const c = Calc.category(id); return c ? c.name : (id ? String(id) : 'Uncategorised'); },
  accName(id){ const a = Calc.account(id); return a ? a.name : '—'; },
  typeMeta(t){ return ACCOUNT_TYPES[t] || { label: t, kind: 'asset' }; },

  activeAccounts(lens){
    return DB.accounts.filter(a => !a.archived && (!lens || lens === 'all' || a.owner === lens));
  },

  /* balance of an account expressed in the base currency (always positive) */
  accBase(a){ return toBase(a.balance || 0, a.currency); },

  /* ---- position ---- */
  netWorth(lens){
    const accs = Calc.activeAccounts(lens);
    let assets = 0, liabilities = 0, cash = 0, invested = 0;
    const byType = {}, byOwner = { me: 0, partner: 0, joint: 0 }, byCurrency = {};
    for (const a of accs){
      const v = Calc.accBase(a);
      const meta = Calc.typeMeta(a.type);
      if (meta.kind === 'asset'){
        assets += v;
        if (meta.liquid) cash += v;
        if (meta.invest) invested += v;
        byType[a.type] = (byType[a.type] || 0) + v;
        byOwner[a.owner] = (byOwner[a.owner] || 0) + v;
        byCurrency[a.currency] = (byCurrency[a.currency] || 0) + v;
      } else {
        liabilities += v;
        byOwner[a.owner] = (byOwner[a.owner] || 0) - v;
      }
    }
    return { assets, liabilities, net: assets - liabilities, cash, invested, byType, byOwner, byCurrency };
  },

  /* asset allocation folded into ≤6 read-friendly classes */
  allocation(lens){
    const nw = Calc.netWorth(lens);
    const t = nw.byType;
    const pick = keys => sum(keys, k => t[k] || 0);
    const classes = [
      { label: 'Cash',        val: pick(['checking', 'savings', 'cash']) },
      { label: 'Retirement',  val: pick(['retirement', 'pension']) },
      { label: 'Investments', val: pick(['brokerage']) },
      { label: 'Property',    val: pick(['property']) },
      { label: 'Vehicle',     val: pick(['vehicle']) },
      { label: 'Other',       val: pick(['business', 'other_asset']) }
    ].filter(c => c.val > 0.5);
    return { classes, total: nw.assets };
  },

  /* ---- net worth history (from balance-history entries) ---- */
  netWorthSeries(nMonths, lens){
    const accs = Calc.activeAccounts(lens);
    const byAcc = groupBy(DB.balances, b => b.accountId);
    for (const [, list] of byAcc) list.sort((a, b) => a.date < b.date ? -1 : 1);
    const thisM = monthKey(todayISO());
    const rows = [];
    for (let i = nMonths - 1; i >= 0; i--){
      const mk = shiftMonthKey(thisM, -i);
      const end = monthEndISO(mk);
      let assets = 0, liabilities = 0;
      for (const a of accs){
        const meta = Calc.typeMeta(a.type);
        let bal;
        if (i === 0) bal = a.balance || 0;                     // current month = live balance
        else {
          const list = byAcc.get(a.id);
          if (list && list.length){
            let last = null;
            for (const b of list){ if (b.date <= end) last = b; else break; }
            bal = last ? last.balance : null;                   // account presumed not yet open
          } else bal = null;
        }
        if (bal == null) continue;
        const v = toBase(bal, a.currency);
        if (meta.kind === 'asset') assets += v; else liabilities += v;
      }
      rows.push({ key: mk, label: monthLabel(mk, true), assets, liabilities, net: assets - liabilities });
    }
    return rows;
  },

  /* ---- transactions ---- */
  txBase(tx){ return toBase(tx.amount || 0, tx.currency, tx.fxOverride); },
  txCatLines(tx){
    if (Array.isArray(tx.splits) && tx.splits.length){
      return tx.splits.map(s => ({ categoryId: s.categoryId, amount: toBase(s.amount || 0, tx.currency, tx.fxOverride) }));
    }
    return [{ categoryId: tx.categoryId, amount: Calc.txBase(tx) }];
  },
  txInMonth(mk, lens){
    return DB.transactions.filter(t => monthKey(t.date) === mk && (!lens || lens === 'all' || t.owner === lens));
  },

  monthStats(mk, lens){
    const txs = Calc.txInMonth(mk, lens);
    let income = 0, spending = 0, invest = 0, debtRepay = 0, transfers = 0;
    const byCategory = new Map(), incomeByCat = new Map();
    for (const t of txs){
      const v = Calc.txBase(t);
      if (t.type === 'income'){
        income += v;
        for (const l of Calc.txCatLines(t)) incomeByCat.set(l.categoryId, (incomeByCat.get(l.categoryId) || 0) + l.amount);
      } else if (t.type === 'expense'){
        spending += v;
        for (const l of Calc.txCatLines(t)) byCategory.set(l.categoryId, (byCategory.get(l.categoryId) || 0) + l.amount);
      } else if (t.type === 'refund'){
        spending -= v;
        for (const l of Calc.txCatLines(t)) byCategory.set(l.categoryId, (byCategory.get(l.categoryId) || 0) - l.amount);
      } else if (t.type === 'invest') invest += v;
      else if (t.type === 'debt'){
        // Payments on revolving accounts (credit cards) settle spending that
        // was already recorded as expenses — count only installment debt here.
        const acc = Calc.account(t.accountId);
        if (!(acc && Calc.typeMeta(acc.type).revolving)) debtRepay += v;
      }
      else if (t.type === 'transfer') transfers += v;
    }
    const cashSavings = income - spending - debtRepay;
    const savingsRate = income > 0 ? cashSavings / income * 100 : null;
    const totalSavings = cashSavings + invest;
    const savingsRateIncl = (income + invest) > 0 ? totalSavings / (income + invest) * 100 : null;
    return { key: mk, income, spending, invest, debtRepay, transfers, byCategory, incomeByCat, cashSavings, savingsRate, totalSavings, savingsRateIncl };
  },

  monthlySeries(n, lens){
    const thisM = monthKey(todayISO());
    const out = [];
    for (let i = n - 1; i >= 0; i--){
      const mk = shiftMonthKey(thisM, -i);
      const s = Calc.monthStats(mk, lens);
      s.label = monthLabel(mk, true);
      out.push(s);
    }
    return out;
  },

  lastCompleteMonth(){ return shiftMonthKey(monthKey(todayISO()), -1); },

  essentialMonthly(lens){
    // average essential spending + debt repayments over the last 3 complete months
    let tot = 0, n = 0;
    for (let i = 1; i <= 3; i++){
      const mk = shiftMonthKey(monthKey(todayISO()), -i);
      const s = Calc.monthStats(mk, lens);
      let ess = 0;
      for (const [cid, amt] of s.byCategory){
        const c = Calc.category(cid);
        if (c && c.essential) ess += amt;
      }
      tot += ess + s.debtRepay; n++;
    }
    return n ? tot / n : 0;
  },

  efMonths(lens){
    const ess = Calc.essentialMonthly(lens);
    const cash = Calc.netWorth(lens).cash;
    return ess > 0 ? cash / ess : null;
  },

  spendingByCategory(mk, lens){
    const s = Calc.monthStats(mk, lens);
    const rows = [];
    for (const [cid, amt] of s.byCategory){
      if (amt > 0.004) rows.push({ categoryId: cid, name: Calc.catName(cid), amount: amt });
    }
    return sortBy(rows, r => r.amount, true);
  },

  duplicates(){
    const txs = DB.transactions.filter(t => t.type === 'expense');
    const out = [];
    const seen = new Set();
    for (let i = 0; i < txs.length; i++){
      for (let j = i + 1; j < txs.length; j++){
        const a = txs[i], b = txs[j];
        if (Math.abs(a.amount - b.amount) < 0.005 && a.desc === b.desc && a.accountId === b.accountId &&
            Math.abs(diffDays(a.date, b.date)) <= 3 && a.amount >= 15){
          const k = a.id + b.id;
          if (!seen.has(k)){ seen.add(k); out.push([a, b]); }
        }
      }
    }
    return out.slice(0, 5);
  },

  /* ---- scheduled cash flows ---- */
  occurrences(item, fromISO, toISO){
    const out = [];
    const f = item.frequency;
    if (!item.startDate) return out;
    if (item.endDate && item.endDate < fromISO) return out;
    const push = iso => {
      if (iso >= fromISO && iso <= toISO && (!item.endDate || iso <= item.endDate)) out.push(iso);
    };
    if (f === 'once'){ push(item.startDate); return out; }
    if (f === 'weekly' || f === 'fortnightly'){
      const step = f === 'weekly' ? 7 : 14;
      let k = Math.max(0, Math.floor(diffDays(item.startDate, fromISO) / step));
      for (let guard = 0; guard < 400; guard++, k++){
        const iso = addDaysISO(item.startDate, k * step);
        if (iso > toISO) break;
        push(iso);
      }
      return out;
    }
    const stepM = f === 'monthly' ? 1 : f === 'quarterly' ? 3 : f === 'semiannual' ? 6 : f === 'annually' ? 12 : null;
    if (stepM == null) return out;
    let k = 0;
    const approxMonths = Math.max(0, Math.floor(diffDays(item.startDate, fromISO) / 31));
    k = Math.max(0, Math.floor(approxMonths / stepM) - 1);
    for (let guard = 0; guard < 400; guard++, k++){
      const iso = addMonthsISO(item.startDate, k * stepM);
      if (iso > toISO) break;
      push(iso);
    }
    return out;
  },

  monthlyized(item){
    const v = toBase(item.amount || 0, item.currency);
    switch (item.frequency){
      case 'weekly': return v * 52 / 12;
      case 'fortnightly': return v * 26 / 12;
      case 'monthly': return v;
      case 'quarterly': return v / 3;
      case 'semiannual': return v / 6;
      case 'annually': return v / 12;
      default: return 0;
    }
  },

  _isLiquidAcc(id){
    const a = Calc.account(id);
    return a ? !!Calc.typeMeta(a.type).liquid : false;
  },

  /* daily household cash projection over `days` (lens-independent by design) */
  projectCashflow(days){
    const from = todayISO();
    const to = addDaysISO(from, days);
    const start = Calc.netWorth('all').cash;
    const minCash = toNum(DB.settings.minCash, 0);
    const flows = new Map(); // iso -> {net, events:[{name, amt}]}
    for (const item of DB.scheduled){
      let dir = 0;
      if (item.type === 'income') dir = +1;
      else if (item.type === 'expense' || item.type === 'debt' || item.type === 'invest') dir = -1;
      else if (item.type === 'transfer') dir = Calc._isLiquidAcc(item.toAccountId) ? 0 : -1; // liquid→liquid stays inside the cash pool
      if (dir === 0) continue;
      const amt = toBase(item.amount || 0, item.currency) * dir;
      for (const iso of Calc.occurrences(item, addDaysISO(from, 1), to)){
        if (!flows.has(iso)) flows.set(iso, { net: 0, events: [] });
        const f = flows.get(iso);
        f.net += amt;
        f.events.push({ name: item.name, amt });
      }
    }
    const points = [{ date: from, bal: start, events: [] }];
    let bal = start, min = { date: from, bal: start };
    const warnings = [];
    for (let i = 1; i <= days; i++){
      const iso = addDaysISO(from, i);
      const f = flows.get(iso);
      if (f) bal += f.net;
      points.push({ date: iso, bal, events: f ? f.events : [] });
      if (bal < min.bal) min = { date: iso, bal };
      if (f && bal < minCash) warnings.push({ date: iso, bal });
    }
    const safe = Math.max(0, min.bal - minCash);
    return { points, min, warnings, safe, start, minCash };
  },

  upcoming(daysAhead, limit){
    const from = todayISO();
    const to = addDaysISO(from, daysAhead);
    const rows = [];
    for (const item of DB.scheduled){
      for (const iso of Calc.occurrences(item, from, to)){
        rows.push({ date: iso, item, amtBase: toBase(item.amount || 0, item.currency) });
      }
    }
    rows.sort((a, b) => a.date < b.date ? -1 : 1);
    return limit ? rows.slice(0, limit) : rows;
  },

  /* ---- goals ---- */
  goalCurrent(g){
    if (g.accountId){
      const a = Calc.account(g.accountId);
      if (a) return Calc.accBase(a);
    }
    return toNum(g.current, 0);
  },
  goalTarget(g){
    let t = toNum(g.target, 0);
    if (g.inflationAdj && g.targetDate){
      const yrs = Math.max(0, diffDays(todayISO(), g.targetDate) / 365.25);
      t = t * Math.pow(1 + toNum(DB.settings.inflation, 0) / 100, yrs);
    }
    return t;
  },
  goalMath(g){
    const current = Calc.goalCurrent(g);
    const target = Calc.goalTarget(g);
    const pct = target > 0 ? clamp(current / target * 100, 0, 100) : 0;
    const remaining = Math.max(0, target - current);
    const i = toNum(g.expReturn, 0) / 100 / 12;
    const monthly = toNum(g.monthly, 0);
    let monthsToDate = null;
    if (g.targetDate){
      const dd = diffDays(todayISO(), g.targetDate);
      monthsToDate = Math.max(0, Math.round(dd / 30.44));
    }
    // required monthly to hit the target by the target date
    let requiredMonthly = null;
    if (monthsToDate != null){
      if (monthsToDate <= 0) requiredMonthly = remaining;
      else if (i > 0){
        const f = Math.pow(1 + i, monthsToDate);
        requiredMonthly = Math.max(0, (target - current * f) * i / (f - 1));
      } else requiredMonthly = Math.max(0, (target - current) / monthsToDate);
    }
    // projected months to reach target at the planned contribution
    let projMonths = null;
    if (current >= target) projMonths = 0;
    else if (monthly > 0 || (i > 0 && current > 0)){
      if (i > 0){
        const num = target * i + monthly, den = current * i + monthly;
        if (den > 0 && num / den > 0){
          const n = Math.log(num / den) / Math.log(1 + i);
          projMonths = (isFinite(n) && n >= 0 && n < 1200) ? Math.ceil(n) : null;
        }
      } else if (monthly > 0) projMonths = Math.ceil((target - current) / monthly);
    }
    const projDate = projMonths != null ? addMonthsISO(todayISO(), projMonths) : null;
    let onTrack = null;
    if (g.targetDate && projDate) onTrack = projDate <= g.targetDate;
    else if (g.targetDate && projMonths == null) onTrack = false;
    return { current, target, pct, remaining, monthsToDate, requiredMonthly, projMonths, projDate, onTrack, monthly };
  },

  goalPlan(){
    const goals = DB.goals.map(g => ({ g, m: Calc.goalMath(g) }));
    const planned = sum(goals, x => toNum(x.g.monthly, 0));
    // funding capacity = average cash savings + investment contributions, last 3 complete months
    let cap = 0, n = 0;
    for (let i = 1; i <= 3; i++){
      const s = Calc.monthStats(shiftMonthKey(monthKey(todayISO()), -i), 'all');
      cap += s.cashSavings + s.invest; n++;
    }
    cap = n ? cap / n : 0;
    return { goals, planned, capacity: cap, gap: cap - planned };
  },

  /* ---- debt ---- */
  amortMonths(balance, ratePct, payment){
    if (balance <= 0) return { months: 0, interest: 0 };
    if (!payment || payment <= 0) return { months: Infinity, interest: Infinity };
    const i = (ratePct || 0) / 100 / 12;
    if (i === 0) return { months: Math.ceil(balance / payment), interest: 0 };
    if (payment <= balance * i) return { months: Infinity, interest: Infinity };
    const n = -Math.log(1 - i * balance / payment) / Math.log(1 + i);
    return { months: Math.ceil(n), interest: payment * n - balance };
  },

  debts(lens){
    return Calc.activeAccounts(lens)
      .filter(a => Calc.typeMeta(a.type).kind === 'liability' && (a.balance || 0) > 0)
      .map(a => ({
        acc: a, balance: Calc.accBase(a), rate: toNum(a.rate, 0),
        payment: toBase(toNum(a.contribution, 0), a.currency),
        revolving: !!Calc.typeMeta(a.type).revolving
      }));
  },

  debtFreeInfo(lens){
    const ds = Calc.debts(lens);
    if (!ds.length) return { months: 0, date: null, total: 0, unknown: false };
    let worst = 0, unknown = false;
    for (const dd of ds){
      const am = Calc.amortMonths(dd.balance, dd.rate, dd.payment);
      if (!isFinite(am.months)) unknown = true;
      else worst = Math.max(worst, am.months);
    }
    return { months: worst, date: unknown ? null : addMonthsISO(todayISO(), worst), total: sum(ds, d => d.balance), unknown };
  },

  dti(lens){
    const pays = sum(Calc.debts(lens).filter(d => !d.revolving), d => d.payment);
    let inc = 0, n = 0;
    for (let i = 1; i <= 3; i++){ inc += Calc.monthStats(shiftMonthKey(monthKey(todayISO()), -i), lens).income; n++; }
    inc = n ? inc / n : 0;
    return inc > 0 ? pays / inc * 100 : null;
  },

  /* ---- long-term forecast ----
     Deterministic monthly simulation; yearly snapshots. All flows in
     today's base currency; `netReal` deflates by the inflation case. */
  baselineParams(){
    const s = DB.settings;
    let income = 0, spend = 0, invest = 0, n = 0;
    for (let i = 1; i <= 3; i++){
      const st = Calc.monthStats(shiftMonthKey(monthKey(todayISO()), -i), 'all');
      income += st.income; spend += st.spending; invest += st.invest; n++;
    }
    income = n ? income / n : 0; spend = n ? spend / n : 0; invest = n ? invest / n : 0;
    const ov = DB.forecast.overrides || {};
    if (ov.income != null) income = ov.income;
    if (ov.spend != null) spend = ov.spend;
    if (ov.invest != null) invest = ov.invest;
    const nw = Calc.netWorth('all');
    return {
      age: toNum(s.age, 35), partnerAge: toNum(s.partnerAge, null),
      startCash: nw.cash, startInvested: nw.invested,
      startOther: nw.assets - nw.cash - nw.invested,
      debts: Calc.debts('all').map(d => ({ balance: d.balance, rate: d.rate, payment: d.payment })),
      incomeMonthly: income, spendMonthly: spend, investMonthly: invest,
      retireAge: toNum(s.retirementAge, 65), retireSpend: toNum(s.retireSpend, spend),
      cashFloor: toNum(s.minCash, 0),
      majorExpenses: (DB.forecast.majorExpenses || []).map(e => ({ year: toNum(e.year, 0), amount: toNum(e.amount, 0), label: e.label }))
    };
  },

  runForecast(P, C){
    // C: {ret, infl, growth} in % / yr
    const mRet = Math.pow(1 + toNum(C.ret, 0) / 100, 1 / 12) - 1;
    const gInfl = toNum(C.infl, 0) / 100, gGrow = toNum(C.growth, 0) / 100;
    const mInfl = Math.pow(1 + gInfl, 1 / 12) - 1;
    const mGrow = Math.pow(1 + gGrow, 1 / 12) - 1;
    const endAge = 90;
    const years = Math.max(1, Math.min(60, endAge - P.age));
    let cash = P.startCash, invested = P.startInvested, other = P.startOther;
    let income = P.incomeMonthly, spend = P.spendMonthly, invest = P.investMonthly;
    const debts = P.debts.map(d => Object.assign({}, d));
    const startYear = new Date().getFullYear();
    const rows = [];
    let depleted = null, atRetire = null;
    for (let m = 1; m <= years * 12; m++){
      const age = P.age + m / 12;
      const retired = age >= P.retireAge;
      let debtPay = 0;
      for (const dd of debts){
        if (dd.balance <= 0) continue;
        const int = dd.balance * (dd.rate / 100 / 12);
        let pay = dd.payment;
        // no payment set (or below interest): assume a typical minimum payment
        // so an untended balance amortises instead of compounding forever
        if (pay <= int) pay = int + Math.max(25, dd.balance * 0.02);
        pay = Math.min(pay, dd.balance + int);
        dd.balance = Math.max(0, dd.balance + int - pay);
        debtPay += pay;
      }
      const inc = retired ? 0 : income;
      const spd = retired ? P.retireSpend * Math.pow(1 + mInfl, m) : spend;
      const inv = retired ? 0 : invest;
      let surplus = inc - spd - debtPay - inv;
      cash += surplus;
      invested = invested * (1 + mRet) + inv;
      if (cash < 0){ invested += cash; cash = 0; }               // draw down investments
      if (invested < 0){ cash += invested; invested = 0; }
      // sweep surplus cash above a ~6-month buffer into investments
      const buffer = Math.max(P.cashFloor || 0, spd * 6);
      if (cash > buffer){ invested += cash - buffer; cash = buffer; }
      if (!retired){ income *= (1 + mGrow); spend *= (1 + mInfl); invest *= (1 + mGrow); }
      if (m % 12 === 0){
        const yi = m / 12;
        const calYear = startYear + yi;
        for (const e of P.majorExpenses){
          if (e.year === calYear){
            cash -= e.amount;
            if (cash < 0){ invested += cash; cash = 0; }
            if (invested < 0){ cash += invested; invested = 0; }
          }
        }
        const debt = sum(debts, dd => Math.max(0, dd.balance));
        const net = cash + invested + other - debt;
        const row = { yi, age: Math.round(P.age + yi), year: calYear, cash, invested, other, debt, net,
          netReal: net / Math.pow(1 + gInfl, yi) };
        rows.push(row);
        if (atRetire == null && Math.round(P.age + yi) >= P.retireAge) atRetire = row;
        if (depleted == null && cash <= 0 && invested <= 0 && (P.age + yi) >= P.retireAge) depleted = row;
      }
    }
    const retireRow = atRetire || rows[rows.length - 1];
    const swr = 0.04;
    const sustainableMonthly = retireRow ? retireRow.invested * swr / 12 : 0;
    const yrsToRetire = Math.max(0, P.retireAge - P.age);
    const sustainableMonthlyReal = sustainableMonthly / Math.pow(1 + gInfl, yrsToRetire);
    return { rows, retireRow, sustainableMonthly, sustainableMonthlyReal, depleted };
  },

  /* ---- scenarios ---- */
  applyOverrides(P, o){
    const Q = deepClone(P);
    o = o || {};
    Q.incomeMonthly = Math.max(0, Q.incomeMonthly * (1 + toNum(o.incomePct, 0) / 100) + toNum(o.incomeAbs, 0));
    Q.spendMonthly = Math.max(0, Q.spendMonthly * (1 + toNum(o.spendPct, 0) / 100) + toNum(o.spendAbs, 0));
    Q.investMonthly = Math.max(0, Q.investMonthly + toNum(o.investAbs, 0));
    const extra = toNum(o.extraDebt, 0);
    if (extra > 0 && Q.debts.length){
      const hi = Q.debts.reduce((a, b) => (b.rate > a.rate ? b : a), Q.debts[0]);
      hi.payment += extra;
    }
    const startYear = new Date().getFullYear();
    for (const oo of (o.oneOffs || [])){
      if (toNum(oo.amount, 0) !== 0){
        Q.majorExpenses.push({ year: startYear + toNum(oo.yearOffset, 1), amount: toNum(oo.amount, 0), label: oo.label || 'One-off cost' });
      }
    }
    return Q;
  },
  caseWith(o){
    const base = DB.forecast.cases.base;
    return { ret: toNum(base.ret, 5) + toNum(o && o.retDelta, 0), infl: toNum(base.infl, 2.5) + toNum(o && o.inflDelta, 0), growth: toNum(base.growth, 3) };
  },
  scenarioCompare(overrides){
    const P = Calc.baselineParams();
    const C = DB.forecast.cases.base;
    const base = Calc.runForecast(P, C);
    const Q = Calc.applyOverrides(P, overrides);
    const scn = Calc.runForecast(Q, Calc.caseWith(overrides));
    const at = (res, yi) => { const r = res.rows.find(x => x.yi === yi); return r ? r.net : null; };
    const loanPay = p => sum(p.debts.filter(d => !d.revolving), d => d.payment);
    const surplus = p => p.incomeMonthly - p.spendMonthly - loanPay(p) - p.investMonthly;
    const runway = p => { const burn = p.spendMonthly + loanPay(p); return burn > 0 ? p.startCash / burn : null; };
    const debtFree = res => { const r = res.rows.find(x => x.debt <= 1); return r ? r.year : null; };
    return {
      base, scn, P, Q,
      table: [1, 5, 10, 20].map(yi => ({ yi, base: at(base, yi), scn: at(scn, yi) })),
      surplusBase: surplus(P), surplusScn: surplus(Q),
      runwayBase: runway(P), runwayScn: runway(Q),
      debtFreeBase: debtFree(base), debtFreeScn: debtFree(scn),
      retireBase: base.sustainableMonthlyReal, retireScn: scn.sustainableMonthlyReal
    };
  },

  scenarioTemplates(){
    return [
      { id: 'quit', name: 'Quit my job', o: { incomePct: -52 }, note: 'One salary stops; spending unchanged.' },
      { id: 'break', name: 'Six-month career break', o: { incomePct: -52, oneOffs: [{ yearOffset: 1, amount: 0, label: '' }] }, note: 'Model as income down for the year; tweak to taste.' },

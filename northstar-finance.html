  /* ---- budget ---- */
  fyMonths(mk){
    // month keys from financial-year start to (and excluding) mk
    const fy = toNum(DB.settings.fyStartMonth, 1);
    const [y, m] = mk.split('-').map(Number);
    const startY = m >= fy ? y : y - 1;
    const out = [];
    let cur = startY + '-' + pad2(fy);
    while (cur < mk){ out.push(cur); cur = shiftMonthKey(cur, 1); }
    return out;
  },
  budgetRows(mk){
    const stats = Calc.monthStats(mk, 'all');
    const today = todayISO();
    const isCurrent = mk === monthKey(today);
    const [y, m] = mk.split('-').map(Number);
    const dim = daysInMonth(y, m);
    const elapsed = isCurrent ? Math.max(1, parseISO(today).getDate()) : dim;
    const priorStats = {};
    const rows = [];
    for (const c of DB.categories){
      if (c.type !== 'expense') continue;
      const b = DB.budgets[c.id];
      const budget = b ? toNum(b.amount, 0) : 0;
      const actual = stats.byCategory.get(c.id) || 0;
      if (!b && actual < 0.005) continue;
      let carry = 0;
      if (b && b.rollover){
        for (const pmk of Calc.fyMonths(mk)){
          if (!priorStats[pmk]) priorStats[pmk] = Calc.monthStats(pmk, 'all');
          carry += budget - (priorStats[pmk].byCategory.get(c.id) || 0);
        }
      }
      const avail = budget + carry;
      // pace: fixed costs land once, so extrapolating them is misleading;
      // variable costs extrapolate only once a few days have elapsed
      let forecastEOM = actual;
      if (isCurrent){
        if (c.fixed || elapsed < 5) forecastEOM = Math.max(actual, budget);
        else forecastEOM = actual / elapsed * dim;
      }
      rows.push({
        cat: c, budget, carry, avail, actual,
        remaining: avail - actual, variance: avail - actual,
        forecastEOM, rollover: !!(b && b.rollover)
      });
    }
    return sortBy(rows, r => r.actual, true);
  },
  modelBuckets(mk){
    const s = Calc.monthStats(mk, 'all');
    const buckets = { needs: 0, wants: 0, saving: 0, investing: 0, debt: 0 };
    for (const [cid, amt] of s.byCategory){
      const c = Calc.category(cid);
      const g = c && c.group && buckets[c.group] != null ? c.group : 'wants';
      if (g === 'debt' || g === 'investing') buckets[g] += amt; else buckets[g] += amt;
    }
    buckets.investing += s.invest;
    buckets.debt += s.debtRepay;
    buckets.saving = Math.max(0, s.income - s.spending - s.debtRepay);
    return { buckets, income: s.income + s.invest };
  },
  annualPlan(){
    const rows = DB.scheduled
      .filter(i => ['quarterly', 'semiannual', 'annually', 'once'].includes(i.frequency) && i.type !== 'income' && i.type !== 'transfer')
      .map(i => {
        const next = Calc.occurrences(i, todayISO(), addDaysISO(todayISO(), 366))[0] || null;
        const amt = toBase(i.amount, i.currency);
        const perMonth = i.frequency === 'once' ? (next ? amt / Math.max(1, Math.round(diffDays(todayISO(), next) / 30.44)) : 0) : Calc.monthlyized(i);
        return { item: i, next, amount: amt, perMonth };
      })
      .filter(r => r.next);
    return sortBy(rows, r => r.next);
  },

  /* ---- household ---- */
  householdContrib(mk){
    const txs = Calc.txInMonth(mk, 'all').filter(t => t.owner === 'joint' && (t.type === 'expense' || t.type === 'debt'));
    const paid = { me: 0, partner: 0, joint: 0 };
    let total = 0;
    for (const t of txs){
      const acc = Calc.account(t.accountId);
      const who = acc ? acc.owner : 'joint';
      const v = Calc.txBase(t);
      paid[who] = (paid[who] || 0) + v;
      total += v;
    }
    return { paid, total };
  },

  /* ---- financial health ---- */
  health(){
    const S = DB.settings;
    const cats = [];
    const push = (id, label, weight, score, status, target, reason, action, priority) =>
      cats.push({ id, label, weight, score: clamp(score, 0, 1), status, target, reason, action, priority });

    const mkPrev = Calc.lastCompleteMonth();
    const last3 = [1, 2, 3].map(i => Calc.monthStats(shiftMonthKey(monthKey(todayISO()), -i), 'all'));
    const avgIncome = sum(last3, s => s.income) / 3;
    const avgRate = avgIncome > 0 ? sum(last3, s => s.cashSavings) / sum(last3, s => s.income) * 100 : 0;
    const posMonths = Calc.monthlySeries(6, 'all').slice(0, 6).filter(s => s.cashSavings > 0).length;

    push('cashflow', 'Cash-flow stability', 12,
      0.55 * clamp(posMonths / 6, 0, 1) + 0.45 * clamp(avgRate / Math.max(1, S.savingsTarget), 0, 1),
      posMonths + ' of the last 6 months ended with a cash surplus',
      'Every month cash-positive',
      'Score = months with a surplus (55%) + average surplus vs your ' + fmtPct(S.savingsTarget, 0) + ' savings-rate target (45%).',
      posMonths >= 5 ? 'Keep the buffer: review any month that dips negative.' : 'Trim recurring costs until most months end cash-positive.',
      posMonths >= 5 ? 'low' : 'high');

    const efM = Calc.efMonths('all');
    push('ef', 'Emergency fund', 15,
      efM != null ? efM / Math.max(1, S.efTargetMonths) : 0,
      efM != null ? efM.toFixed(1) + ' months of essential spending' : 'Not measurable yet',
      S.efTargetMonths + ' months',
      'Liquid cash ÷ average essential spending (essential categories + loan payments, last 3 complete months).',
      efM != null && efM >= S.efTargetMonths ? 'Target met — consider putting further surplus to work.' : 'Direct surplus cash here until you reach the target.',
      efM != null && efM >= S.efTargetMonths ? 'low' : 'high');

    const debts = Calc.debts('all');
    const hi = debts.filter(d => d.rate >= 10);
    const hiBal = sum(hi, d => d.balance);
    const dtiv = Calc.dti('all');
    push('debt', 'Debt burden', 12,
      (1 - 0.6 * clamp(hiBal / Math.max(1, avgIncome * 3), 0, 1)) * (1 - 0.4 * clamp(((dtiv || 0) - 15) / 25, 0, 1)),
      hi.length ? fmtMoney(hiBal) + ' at ≥10% APR' : 'No high-interest debt',
      'No balances above 10% APR; debt payments well under 15% of take-home',
      'Debt payments are ' + (dtiv != null ? fmtPct(dtiv, 0) : '—') + ' of take-home income. High-interest balances weigh heaviest.',
      hi.length ? 'Prioritise paying down ' + hi[0].acc.name + ' (' + fmtPct(hi[0].rate, 1) + ' APR).' : 'Maintain payments; revisit rates at renewal.',
      hi.length ? 'high' : 'low');

    push('savings', 'Savings rate', 12,
      clamp(avgRate / Math.max(1, S.savingsTarget), 0, 1),
      fmtPct(avgRate, 1) + ' average (cash basis, last 3 months)',
      fmtPct(S.savingsTarget, 0) + ' of take-home income',
      '(Income − spending − loan payments) ÷ income; credit-card payments are settled spending, not saving. Payroll investing counts on top of this figure.',
      avgRate >= S.savingsTarget ? 'On target — consider automating the surplus.' : 'Close the gap via the largest variable categories.',
      avgRate >= S.savingsTarget ? 'low' : 'medium');

    const nwAll = Calc.netWorth('all');
    const retAssets = sum(Calc.activeAccounts('all').filter(a => ['retirement', 'pension'].includes(a.type)), a => Calc.accBase(a));
    const annualInc = avgIncome * 12;
    const mult = Math.max(0.5, (toNum(S.age, 35) - 25) / 5);
    push('retirement', 'Retirement progress', 12,
      annualInc > 0 ? clamp(retAssets / (mult * annualInc), 0, 1) : 0,
      fmtMoney(retAssets, null, { compact: true }) + ' in retirement accounts',
      '≈' + mult.toFixed(1) + '× annual take-home by age ' + toNum(S.age, 35),
      'A common yardstick: ~1× income saved by 30, 2× by 35, 3× by 40. Yours compares retirement balances to ' + mult.toFixed(1) + '× income.',
      'Payroll contributions are the cheapest lever — check employer match is maxed.',
      retAssets >= mult * annualInc ? 'low' : 'medium');

    const excessCash = Math.max(0, nwAll.cash - Math.max(1, Calc.essentialMonthly('all')) * S.efTargetMonths - toNum(S.minCash, 0));
    const investable = nwAll.invested + excessCash;
    const divScore = investable > 0 ? nwAll.invested / investable : 0.5;
    push('diversify', 'Investment diversification', 8,
      divScore,
      fmtMoney(excessCash, null, { compact: true }) + ' cash beyond the emergency target',
      'Long-term money invested, not idling as cash',
      'Measures how much investable money (beyond your emergency fund and cash floor) is actually invested.',
      excessCash > 5000 ? 'Decide a home for the excess cash: goals, index funds, or a higher-yield account.' : 'Allocation looks intentional.',
      excessCash > 15000 ? 'medium' : 'low');

    const activeDocs = DB.documents.filter(dc => dc.category === 'Insurance' && (!dc.expiryDate || dc.expiryDate >= todayISO()));
    push('insurance', 'Insurance coverage', 7,
      clamp(activeDocs.length / 2, 0, 1),
      activeDocs.length + ' active insurance polic' + (activeDocs.length === 1 ? 'y' : 'ies') + ' registered',
      'Core policies registered and in date',
      'Counts unexpired insurance documents in the register (this app can only see what you record).',
      activeDocs.length < 2 ? 'Register your policies so renewals are tracked.' : 'Diarise renewals ~1 month ahead.',
      activeDocs.length === 0 ? 'medium' : 'low');

    const lastYear = String(new Date().getFullYear() - 1);
    const taxDoc = DB.documents.some(dc => dc.category === 'Tax return' && (dc.name || '').includes(lastYear));
    const taxTx = DB.transactions.some(t => t.tax);
    const taxEvt = DB.events.some(e => e.type === 'tax');
    push('tax', 'Tax organisation', 6,
      (taxDoc ? 0.5 : 0) + (taxTx ? 0.25 : 0) + (taxEvt ? 0.25 : 0),
      taxDoc ? lastYear + ' return filed & registered' : 'No ' + lastYear + ' return registered',
      'Last return registered; deadlines diarised; deductible items tagged',
      'Checks: last year’s return in Documents, tax deadlines on the calendar, and tax-related transactions tagged.',
      taxDoc ? 'Keep tagging tax-related spending as it happens.' : 'Add last year’s return to the document register.',
      taxDoc ? 'low' : 'medium');

    const gp = DB.goals.map(g => Calc.goalMath(g));
    const withDates = gp.filter(m => m.onTrack != null);
    const onTrackN = withDates.filter(m => m.onTrack).length;
    push('goals', 'Goal progress', 8,
      withDates.length ? onTrackN / withDates.length : 0.5,
      onTrackN + ' of ' + withDates.length + ' dated goals on schedule',
      'All dated goals tracking to their dates',
      'A goal is “on schedule” when its projected completion (at the planned monthly contribution and expected return) is on or before its target date.',
      onTrackN < withDates.length ? 'Open Goals to see which are behind and by how much.' : 'Review contributions after any income change.',
      onTrackN < withDates.length ? 'medium' : 'low');

    const accs = Calc.activeAccounts('all');
    const fresh = accs.filter(a => a.updatedAt && diffDays(a.updatedAt, todayISO()) <= 90).length;
    const expired = DB.documents.filter(dc => dc.expiryDate && dc.expiryDate < todayISO()).length;
    const fxAge = Math.max(...CURRENCIES.map(c => DB.fx.rates[c] ? diffDays(DB.fx.rates[c].date, todayISO()) : 999));
    push('admin', 'Financial administration', 8,
      0.6 * (accs.length ? fresh / accs.length : 1) + 0.25 * (expired === 0 ? 1 : 0) + 0.15 * (fxAge <= 60 ? 1 : 0),
      fresh + ' of ' + accs.length + ' accounts updated in the last 90 days',
      'Balances fresh, documents in date, exchange rates recent',
      'Freshness of account balances (60%), no expired documents (25%), exchange rates updated within 60 days (15%).',
      fresh < accs.length ? 'Update stale balances — the oldest drive the score.' : 'All fresh. Nice.',
      fresh < accs.length * 0.7 ? 'medium' : 'low');

    const total = Math.round(sum(cats, c => c.score * c.weight));
    return { total, cats };
  },

  /* ---- rule-based briefing (planning insights, not advice) ---- */
  insights(lens){
    const out = [];
    const S = DB.settings;
    const mkNow = monthKey(todayISO());
    const mk1 = shiftMonthKey(mkNow, -1), mk2 = shiftMonthKey(mkNow, -2);
    const s1 = Calc.monthStats(mk1, lens), s2 = Calc.monthStats(mk2, lens);

    if (s1.spending > 0 && s2.spending > 0){
      const d = (s1.spending - s2.spending) / s2.spending * 100;
      let topCat = null, topD = 0;
      for (const [cid, amt] of s1.byCategory){
        const prev = s2.byCategory.get(cid) || 0;
        if (amt - prev > topD){ topD = amt - prev; topCat = cid; }
      }
      out.push({
        sev: Math.abs(d) < 8 ? 'info' : (d > 0 ? 'warn' : 'good'),
        html: 'In ' + monthLabel(mk1) + ', spending was <strong>' + fmtPct(Math.abs(d), 0) + ' ' + (d >= 0 ? 'higher' : 'lower') + '</strong> than ' + monthLabel(mk2) +
          (topCat && topD > 40 && d > 0 ? ' — <strong>' + esc(Calc.catName(topCat)) + '</strong> rose most (+' + fmtMoney(topD) + ').' : '.')
      });
    }
    const efM = Calc.efMonths(lens);
    if (efM != null){
      out.push({
        sev: efM >= S.efTargetMonths ? 'good' : (efM >= S.efTargetMonths * 0.6 ? 'info' : 'warn'),
        html: 'Your emergency fund covers <strong>' + efM.toFixed(1) + ' months</strong> of essential spending (target ' + S.efTargetMonths + ').'
      });
      const excess = Calc.netWorth(lens).cash - Calc.essentialMonthly(lens) * S.efTargetMonths - toNum(S.minCash, 0);
      if (excess > 8000){
        out.push({ sev: 'info', html: 'You hold about <strong>' + fmtMoney(excess, null, { compact: true }) + '</strong> of cash beyond your emergency-fund target and cash floor — worth giving a job.' });
      }
    }
    if (s1.savingsRate != null){
      const on = s1.savingsRate >= S.savingsTarget;
      out.push({
        sev: on ? 'good' : 'warn',
        html: monthLabel(mk1) + ' savings rate: <strong>' + fmtPct(s1.savingsRate, 0) + '</strong> (cash basis), ' + (on ? 'at or above' : 'below') + ' your ' + fmtPct(S.savingsTarget, 0) + ' target' +
          (s1.savingsRateIncl != null ? ' — ' + fmtPct(s1.savingsRateIncl, 0) + ' including payroll investing.' : '.')
      });
    }
    const annuals = Calc.upcoming(45).filter(u => ['quarterly', 'semiannual', 'annually', 'once'].includes(u.item.frequency) && u.item.type !== 'income' && u.item.type !== 'transfer');
    if (annuals.length){
      out.push({ sev: 'info', html: '<strong>' + annuals.length + '</strong> non-monthly payment' + (annuals.length > 1 ? 's' : '') + ' due within 45 days, totalling <strong>' + fmtMoney(sum(annuals, a => a.amtBase)) + '</strong>.' });
    }
    const cf = Calc.projectCashflow(90);
    if (cf.min.bal < cf.minCash){
      out.push({ sev: 'warn', html: 'Projected household cash dips to <strong>' + fmtMoney(cf.min.bal, null, { compact: true }) + '</strong> around ' + fmtDate(cf.min.date, { short: true }) + ', below your ' + fmtMoney(cf.minCash, null, { compact: true }) + ' floor.' });
    }
    const gHouse = DB.goals.find(g => /deposit|house/i.test(g.name)) || DB.goals[0];
    if (gHouse){
      const m = Calc.goalMath(gHouse);
      if (m.projDate){
        out.push({
          sev: m.onTrack === false ? 'warn' : 'good',
          html: 'At the current pace, <strong>' + esc(gHouse.name) + '</strong> completes around <strong>' + monthLabel(monthKey(m.projDate)) + '</strong>' +
            (gHouse.targetDate ? (m.onTrack ? ', ahead of ' : ', after ') + 'your ' + monthLabel(monthKey(gHouse.targetDate)) + ' target.' : '.')
        });
      }
    }
    const nws = Calc.netWorthSeries(4, lens);
    if (nws.length >= 4){
      const d3 = nws[3].net - nws[0].net;
      out.push({ sev: d3 >= 0 ? 'good' : 'warn', html: 'Net worth is ' + (d3 >= 0 ? 'up' : 'down') + ' <strong>' + fmtMoney(Math.abs(d3), null, { compact: true }) + '</strong> over the last three months.' });
    }
    const reimb = DB.transactions.filter(t => t.reimb && t.type === 'expense');
    const reimbT = sum(reimb, t => Calc.txBase(t));
    if (reimbT > 100) out.push({ sev: 'info', html: fmtMoney(reimbT) + ' of spending is marked <strong>reimbursable</strong> — worth chasing.' });
    const usesFx = DB.accounts.some(a => !a.archived && a.currency !== S.baseCurrency);
    if (usesFx){
      const gd = DB.fx.rates.GBP;
      out.push({ sev: 'info', html: 'Multi-currency figures use <strong>manual rates</strong> (e.g. £1 = ' + fmtMoney(toBase(1, 'GBP'), S.baseCurrency, { decimals: 2 }) + ', set ' + fmtDate(gd.date, { short: true }) + '). Update them in Settings.' });
    }
    return out.slice(0, 8);
  },

  nextActions(){
    const S = DB.settings;
    const acts = [];
    const A = (title, why, urgency, impact, effort, confidence, route) =>
      acts.push({ title, why, urgency, impact, effort, confidence, route,
        score: urgency * 3 + impact * 3 + confidence - effort });

    const efM = Calc.efMonths('all');
    const ess = Calc.essentialMonthly('all');
    if (efM != null && efM < S.efTargetMonths){
      const gap = (S.efTargetMonths - efM) * ess;
      A('Build the emergency fund to ' + S.efTargetMonths + ' months', 'You are at ' + efM.toFixed(1) + ' months; the gap is about ' + fmtMoney(gap, null, { compact: true }) + '.', 3, 3, 2, 3, 'goals');
    }
    const hi = Calc.debts('all').filter(d => d.rate >= 10 && d.balance > 100);
    for (const d of hi.slice(0, 1)){
      A('Review high-interest debt: ' + d.acc.name, fmtMoney(d.balance, null, { compact: true }) + ' at ' + fmtPct(d.rate, 1) + ' APR costs ≈' + fmtMoney(d.balance * d.rate / 100 / 12) + '/month in interest.', 3, 3, 2, 3, 'accounts');
    }
    const excess = Calc.netWorth('all').cash - ess * S.efTargetMonths - toNum(S.minCash, 0);
    if (excess > 8000){
      A('Give ' + fmtMoney(excess, null, { compact: true }) + ' of excess cash a job', 'Cash beyond your emergency target could earn more in a higher-yield account or go toward goals.', 2, 2, 1, 2, 'accounts');
    }
    const last3inc = sum([1, 2, 3].map(i => Calc.monthStats(shiftMonthKey(monthKey(todayISO()), -i), 'all')), s => s.income) / 3;
    const last3inv = sum([1, 2, 3].map(i => Calc.monthStats(shiftMonthKey(monthKey(todayISO()), -i), 'all')), s => s.invest) / 3;
    if (last3inc > 0 && last3inv / last3inc < 0.15){
      A('Consider raising retirement contributions', 'Payroll investing is ' + fmtPct(last3inv / last3inc * 100, 0) + ' of take-home; 15%+ is a common long-term aim.', 1, 3, 2, 2, 'forecast');
    }
    const annuals = Calc.upcoming(45).filter(u => ['quarterly', 'semiannual', 'annually', 'once'].includes(u.item.frequency) && u.item.type !== 'income' && u.item.type !== 'transfer' && u.amtBase >= 300);
    for (const u of annuals.slice(0, 1)){
      A('Prepare for ' + u.item.name, fmtMoney(u.amtBase) + ' due ' + fmtDate(u.date, { short: true }) + ' — check the cash-flow view absorbs it.', 2, 1, 1, 3, 'cashflow');
    }
    const subs = DB.scheduled.filter(i => i.categoryId === 'subscriptions');
    if (subs.length){
      const top = sortBy(subs, i => Calc.monthlyized(i), true)[0];
      A('Review your largest subscription: ' + top.name, 'About ' + fmtMoney(Calc.monthlyized(top)) + '/month. Cancel-or-keep is a five-minute decision.', 1, 1, 1, 2, 'budget');
    }
    const dups = Calc.duplicates();
    if (dups.length){
      A('Check a possible duplicate transaction', '“' + dups[0][0].desc + '” appears twice within 3 days for ' + fmtMoney(dups[0][0].amount, dups[0][0].currency) + '.', 1, 1, 1, 1, 'transactions');
    }
    const stale = Calc.activeAccounts('all').filter(a => !a.updatedAt || diffDays(a.updatedAt, todayISO()) > 90);
    for (const a of stale.slice(0, 1)){
      A('Update “' + a.name + '”', 'Last updated ' + (a.updatedAt ? fmtDate(a.updatedAt, { short: true }) : 'never') + ' — stale balances skew net worth and the forecast.', 1, 1, 1, 3, 'accounts');
    }
    if (!DB.documents.some(dc => dc.category === 'Will')){
      A('No will in the document register', 'If you have one, register it; if not, it is a common gap for households with joint finances.', 1, 2, 3, 2, 'documents');
    }
    const gplan = Calc.goalPlan();
    if (gplan.gap < 0){
      A('Goal contributions exceed monthly capacity', 'Planned contributions are ' + fmtMoney(gplan.planned) + '/mo vs ≈' + fmtMoney(gplan.capacity) + '/mo of recent surplus — see the priority view.', 2, 2, 2, 2, 'goals');
    }
    return sortBy(acts, a => a.score, true).slice(0, 6);
  }
};

/* ============================ 4. CHARTS ============================
   Small SVG chart library. Marks follow a fixed spec: 2px lines,
   ≤24px bars with a 4px rounded data-end, 2px surface gaps/rings,
   hairline solid gridlines, selective direct labels, tooltips on
   hover/focus, and a table twin on every chart card.               */

const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, style){
  const el = document.createElementNS(SVG_NS, tag);
  if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (style) el.setAttribute('style', style);
  return el;
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}
function niceTicks(min, max, n){
  if (min === max){ max = min + 1; }
  const span = max - min;
  const step0 = span / Math.max(2, n);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  let step = mag;
  for (const m of [1, 2, 2.5, 5, 10]){ if (mag * m >= step0){ step = mag * m; break; } }
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.001; v += step) ticks.push(round2(v));
  return { lo, hi, ticks };
}

/* ---- shared tooltip ---- */
const Tip = {
  el: null,
  show(x, y){
    const t = Tip.el;
    t.hidden = false;
    const r = t.getBoundingClientRect();
    let left = x + 14, top = y + 12;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 12;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 10;
    t.style.left = Math.max(4, left) + 'px';
    t.style.top = Math.max(4, top) + 'px';
  },
  hide(){ if (Tip.el) Tip.el.hidden = true; },
  build(title, rows){
    const t = Tip.el;
    t.textContent = '';
    if (title){
      const d = document.createElement('div');
      d.className = 'tip-title';
      d.textContent = title;
      t.appendChild(d);
    }
    for (const r of rows || []){
      const row = document.createElement('div');
      row.className = 'tip-row';
      const key = document.createElement('span');
      key.className = 'tip-key' + (r.mark === 'rect' ? ' sw' : '');
      if (r.color){ key.style.borderTopColor = r.color; if (r.mark === 'rect') key.style.background = r.color; }
      else key.style.display = 'none';
      const lab = document.createElement('span');
      lab.className = 'tip-lab';
      lab.textContent = r.label;
      const val = document.createElement('span');
      val.className = 'tip-val';
      val.textContent = r.value;
      row.appendChild(key); row.appendChild(lab); row.appendChild(val);
      t.appendChild(row);
    }
  }
};

const Chart = {

  /* line / area — series: [{name, color:'--s1', values:[num], dash?}] , labels: [str] */
  line(mount, o){
    mount.textContent = '';
    const labels = o.labels || [];
    const series = (o.series || []).filter(s => s.values && s.values.length);
    if (!series.length || labels.length < 2){
      mount.innerHTML = '<div class="chart-empty">Not enough data yet.</div>';
      return;
    }
    const W = Math.max(320, mount.clientWidth || 560);
    const plotH = o.height || 190;
    const m = { top: 14, right: o.endLabels ? 68 : 16, bottom: 26, left: 46 };
    const H = plotH + m.top + m.bottom;
    let vals = [];
    for (const s of series) vals = vals.concat(s.values.filter(isNum));
    if (o.threshold) vals.push(o.threshold.value);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero || (lo > 0 && lo < hi * 0.45)) lo = Math.min(lo, 0);
    const pad = (hi - lo) * 0.08 || 1;
    const t = niceTicks(lo, hi + pad, 4);
    const X = i => m.left + (labels.length === 1 ? 0 : i * (W - m.left - m.right) / (labels.length - 1));
    const Y = v => m.top + plotH - (v - t.lo) / (t.hi - t.lo) * plotH;

    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.aria || 'Line chart' });
    for (const tv of t.ticks){
      svg.appendChild(svgEl('line', { x1: m.left, x2: W - m.right, y1: Y(tv), y2: Y(tv) }, 'stroke:var(--grid);stroke-width:1'));
      svg.appendChild(svgEl('text', { x: m.left - 7, y: Y(tv) + 3.5, 'text-anchor': 'end' }, 'fill:var(--muted);font-size:10.5px'));
      svg.lastChild.textContent = (o.yFmt || (v => fmtNum(v)))(tv);
    }
    if (t.lo < 0 && t.hi > 0) svg.appendChild(svgEl('line', { x1: m.left, x2: W - m.right, y1: Y(0), y2: Y(0) }, 'stroke:var(--axis);stroke-width:1'));
    const every = o.xTicksEvery || Math.ceil(labels.length / Math.floor((W - m.left - m.right) / 56));
    labels.forEach((lab, i) => {
      if (i % every !== 0 && i !== labels.length - 1) return;
      svg.appendChild(svgEl('text', { x: X(i), y: H - 8, 'text-anchor': i === labels.length - 1 ? 'end' : 'middle' }, 'fill:var(--muted);font-size:10.5px'));
      svg.lastChild.textContent = lab;
    });
    if (o.threshold){
      svg.appendChild(svgEl('line', { x1: m.left, x2: W - m.right, y1: Y(o.threshold.value), y2: Y(o.threshold.value), 'stroke-dasharray': '5 4' }, 'stroke:var(--muted);stroke-width:1.3'));
      const tl = svgEl('text', { x: W - m.right, y: Y(o.threshold.value) - 5, 'text-anchor': 'end' }, 'fill:var(--muted);font-size:10px');
      tl.textContent = o.threshold.label || '';
      svg.appendChild(tl);
    }
    const colOf = s => s.rawColor || cssVar(s.color || '--s1');
    series.forEach((s, si) => {
      const col = colOf(s);
      let dAttr = '', area = 'M';
      s.values.forEach((v, i) => {
        if (!isNum(v)) return;
        const cmd = (dAttr === '' ? 'M' : 'L');
        dAttr += cmd + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      });
      if (o.area && series.length === 1){
        const first = s.values.findIndex(isNum), last = s.values.length - 1;
        area = dAttr + 'L' + X(last).toFixed(1) + ' ' + (m.top + plotH) + ' L' + X(first) + ' ' + (m.top + plotH) + ' Z';
        svg.appendChild(svgEl('path', { d: area }, 'fill:' + col + ';opacity:.10'));
      }
      svg.appendChild(svgEl('path', { d: dAttr, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        'stroke-dasharray': s.dash ? '5 4' : 'none' }, 'stroke:' + col + ';stroke-width:2'));
      const li = s.values.length - 1;
      if (isNum(s.values[li])){
        svg.appendChild(svgEl('circle', { cx: X(li), cy: Y(s.values[li]), r: 4 }, 'fill:' + col + ';stroke:var(--surface);stroke-width:2'));
        if (o.endLabels){
          const et = svgEl('text', { x: X(li) + 8, y: Y(s.values[li]) + 3.5 }, 'fill:var(--ink-2);font-size:10.5px;font-weight:600');
          et.textContent = o.endLabelFmt ? o.endLabelFmt(s) : s.name;
          svg.appendChild(et);
        }
      }
    });

    /* crosshair + all-series tooltip */
    const cross = svgEl('line', { x1: 0, x2: 0, y1: m.top, y2: m.top + plotH, visibility: 'hidden' }, 'stroke:var(--axis);stroke-width:1');
    svg.appendChild(cross);
    const dots = series.map(s => {
      const c = svgEl('circle', { r: 4.5, visibility: 'hidden' }, 'fill:' + colOf(s) + ';stroke:var(--surface);stroke-width:2');
      svg.appendChild(c); return c;
    });
    const hit = svgEl('rect', { x: m.left - 8, y: 0, width: W - m.left - m.right + 16, height: H, fill: 'transparent' });
    svg.appendChild(hit);
    const fmt = o.yFmt2 || o.yFmt || (v => fmtNum(v));
    const onMove = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      let idx = Math.round((px - m.left) / ((W - m.left - m.right) / (labels.length - 1)));
      idx = clamp(idx, 0, labels.length - 1);
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx));
      cross.setAttribute('visibility', 'visible');
      const rows = [];
      series.forEach((s, si) => {
        const v = s.values[idx];
        if (isNum(v)){
          dots[si].setAttribute('cx', X(idx)); dots[si].setAttribute('cy', Y(v));
          dots[si].setAttribute('visibility', 'visible');
          rows.push({ color: colOf(s), label: s.name, value: fmt(v) });
        } else dots[si].setAttribute('visibility', 'hidden');
      });
      if (o.tipExtra){ for (const ex of (o.tipExtra(idx) || [])) rows.push(ex); }
      Tip.build(labels[idx], rows);
      Tip.show(ev.clientX, ev.clientY);
    };
    const onOut = () => {
      cross.setAttribute('visibility', 'hidden');
      dots.forEach(d => d.setAttribute('visibility', 'hidden'));
      Tip.hide();
    };
    hit.addEventListener('pointermove', onMove);
    hit.addEventListener('pointerleave', onOut);
    mount.appendChild(svg);
  },

  /* grouped columns — labels + series[{name,color,values}] (values >= 0) */
  columns(mount, o){
    mount.textContent = '';
    const labels = o.labels || [];
    const series = o.series || [];
    if (!labels.length || !series.length){
      mount.innerHTML = '<div class="chart-empty">Not enough data yet.</div>';
      return;
    }
    const W = Math.max(320, mount.clientWidth || 560);
    const plotH = o.height || 190;
    const m = { top: 12, right: 10, bottom: 26, left: 46 };
    const H = plotH + m.top + m.bottom;
    let hi = 0;
    for (const s of series) hi = Math.max(hi, ...s.values.filter(isNum));
    const t = niceTicks(0, hi || 1, 4);
    const Y = v => m.top + plotH - (v - 0) / (t.hi - 0) * plotH;
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.aria || 'Column chart' });
    for (const tv of t.ticks){
      if (tv < 0) continue;
      svg.appendChild(svgEl('line', { x1: m.left, x2: W - m.right, y1: Y(tv), y2: Y(tv) }, 'stroke:var(--grid);stroke-width:1'));
      const tt = svgEl('text', { x: m.left - 7, y: Y(tv) + 3.5, 'text-anchor': 'end' }, 'fill:var(--muted);font-size:10.5px');
      tt.textContent = (o.yFmt || (v => fmtNum(v)))(tv);
      svg.appendChild(tt);
    }
    const slot = (W - m.left - m.right) / labels.length;
    const barW = Math.min(24, Math.max(6, (slot - 14) / series.length - 2));
    const groupW = barW * series.length + 2 * (series.length - 1);
    const fmt = o.yFmt2 || (v => fmtNum(v));
    labels.forEach((lab, i) => {
      const cx = m.left + slot * i + slot / 2;
      const tt = svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, 'fill:var(--muted);font-size:10.5px');
      tt.textContent = lab;
      svg.appendChild(tt);
      series.forEach((s, si) => {
        const v = s.values[i];
        if (!isNum(v)) return;
        const col = s.rawColor || cssVar(s.color || '--s1');
        const x = cx - groupW / 2 + si * (barW + 2);
        const y = Y(Math.max(0, v));
        const h = Math.max(0, m.top + plotH - y);
        const r = Math.min(4, barW / 2, h);
        const dPath = 'M' + x + ' ' + (y + h) + ' L' + x + ' ' + (y + r) +
          ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
          ' L' + (x + barW - r) + ' ' + y +
          ' Q' + (x + barW) + ' ' + y + ' ' + (x + barW) + ' ' + (y + r) +
          ' L' + (x + barW) + ' ' + (y + h) + ' Z';
        const bar = svgEl('path', { d: dPath, tabindex: '0', 'aria-label': lab + ', ' + s.name + ': ' + fmt(v) }, 'fill:' + col + ';outline:none');
        const over = ev => {
          bar.style.opacity = '.8';
          Tip.build(lab, [{ color: col, label: s.name, value: fmt(v), mark: 'rect' }]);
          const bb = bar.getBoundingClientRect();
          Tip.show(ev && ev.clientX ? ev.clientX : bb.x + bb.width / 2, ev && ev.clientY ? ev.clientY : bb.y);
        };
        const out = () => { bar.style.opacity = '1'; Tip.hide(); };
        bar.addEventListener('pointermove', over);
        bar.addEventListener('pointerleave', out);
        bar.addEventListener('focus', () => over(null));
        bar.addEventListener('blur', out);
        svg.appendChild(bar);
      });
    });
    svg.appendChild(svgEl('line', { x1: m.left, x2: W - m.right, y1: Y(0), y2: Y(0) }, 'stroke:var(--axis);stroke-width:1'));
    mount.appendChild(svg);
  },

  /* horizontal bars — rows [{label, value, color?}] ; diverging supported */
  hbars(mount, o){
    mount.textContent = '';
    const rows = (o.rows || []).filter(r => isNum(r.value));
    if (!rows.length){
      mount.innerHTML = '<div class="chart-empty">' + esc(o.empty || 'Nothing to show yet.') + '</div>';
      return;
    }
    const W = Math.max(300, mount.clientWidth || 520);
    const rowH = 26, barH = 13;
    const labW = Math.min(150, Math.max(84, W * 0.26));
    const valW = 66;
    const H = rows.length * rowH + 6;
    const maxAbs = Math.max(...rows.map(r => Math.abs(r.value))) || 1;
    const div = !!o.diverging && rows.some(r => r.value < 0);
    const x0 = labW + 8;
    const span = W - x0 - valW - 8;
    const zeroX = div ? x0 + span / 2 : x0;
    const scale = div ? (span / 2) / maxAbs : span / maxAbs;
    const posC = cssVar(o.posVar || '--s1'), negC = cssVar('--s8');
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.aria || 'Bar chart' });
    if (div) svg.appendChild(svgEl('line', { x1: zeroX, x2: zeroX, y1: 2, y2: H - 2 }, 'stroke:var(--axis);stroke-width:1'));
    const fmt = o.fmt || (v => fmtNum(v));
    rows.forEach((r, i) => {
      const y = i * rowH + (rowH - barH) / 2 + 3;
      const lab = svgEl('text', { x: labW, y: y + barH / 2 + 3.5, 'text-anchor': 'end' }, 'fill:var(--ink-2);font-size:11.5px');
      lab.textContent = r.label.length > 22 ? r.label.slice(0, 21) + '…' : r.label;
      svg.appendChild(lab);
      const v = r.value;
      const w = Math.max(1.5, Math.abs(v) * scale);
      const col = r.rawColor || (r.color ? cssVar(r.color) : (v < 0 && div ? negC : posC));
      const x = v < 0 && div ? zeroX - w : zeroX;
      const rr = Math.min(4, w, barH / 2);
      let dPath;
      if (v >= 0 || !div){
        dPath = 'M' + x + ' ' + y + ' L' + (x + w - rr) + ' ' + y + ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + rr) +
          ' L' + (x + w) + ' ' + (y + barH - rr) + ' Q' + (x + w) + ' ' + (y + barH) + ' ' + (x + w - rr) + ' ' + (y + barH) +
          ' L' + x + ' ' + (y + barH) + ' Z';
      } else {
        dPath = 'M' + (x + w) + ' ' + y + ' L' + (x + rr) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + rr) +
          ' L' + x + ' ' + (y + barH - rr) + ' Q' + x + ' ' + (y + barH) + ' ' + (x + rr) + ' ' + (y + barH) +
          ' L' + (x + w) + ' ' + (y + barH) + ' Z';
      }
      const bar = svgEl('path', { d: dPath, tabindex: '0', 'aria-label': r.label + ': ' + fmt(v) }, 'fill:' + col + ';outline:none');
      const over = ev => {
        bar.style.opacity = '.8';
        Tip.build(r.label, [{ color: col, label: r.sub || '', value: fmt(v), mark: 'rect' }]);
        const bb = bar.getBoundingClientRect();
        Tip.show(ev && ev.clientX ? ev.clientX : bb.x + bb.width, ev && ev.clientY ? ev.clientY : bb.y);
      };
      const out = () => { bar.style.opacity = '1'; Tip.hide(); };
      bar.addEventListener('pointermove', over);
      bar.addEventListener('pointerleave', out);
      bar.addEventListener('focus', () => over(null));
      bar.addEventListener('blur', out);
      svg.appendChild(bar);
      const vx = (v >= 0 || !div) ? x + w + 6 : x - 6;
      const vt = svgEl('text', { x: vx, y: y + barH / 2 + 3.5, 'text-anchor': (v >= 0 || !div) ? 'start' : 'end' },
        'fill:var(--ink);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums');
      vt.textContent = fmt(v);
      svg.appendChild(vt);
    });
    mount.appendChild(svg);
  },

  /* donut — part-to-whole, ≤6 segments, 2px surface gaps, centre total */
  donut(mount, o){
    mount.textContent = '';
    const rows = (o.rows || []).filter(r => r.value > 0);
    if (!rows.length){
      mount.innerHTML = '<div class="chart-empty">Nothing to show yet.</div>';
      return;
    }
    const size = o.size || 172, R = size / 2, r1 = R - 4, r0 = R - 26;
    const total = sum(rows, r => r.value);
    const svg = svgEl('svg', { viewBox: '0 0 ' + size + ' ' + size, role: 'img', 'aria-label': o.aria || 'Breakdown chart' },
      'max-width:' + size + 'px;margin:0 auto');
    let a0 = -Math.PI / 2;
    const fmt = o.fmt || (v => fmtNum(v));
    for (const row of rows){
      const frac = row.value / total;
      const a1 = a0 + frac * Math.PI * 2;
      const large = frac > 0.5 ? 1 : 0;
      const p = (rr, a) => (R + rr * Math.cos(a)).toFixed(2) + ' ' + (R + rr * Math.sin(a)).toFixed(2);
      const d = 'M' + p(r1, a0) + ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p(r1, a1) +
        ' L' + p(r0, a1) + ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p(r0, a0) + ' Z';
      const col = row.rawColor || cssVar(row.color || '--s1');
      const seg = svgEl('path', { d, tabindex: '0', 'aria-label': row.label + ': ' + fmt(row.value) },
        'fill:' + col + ';stroke:var(--surface);stroke-width:2;outline:none');
      const over = ev => {
        seg.style.opacity = '.82';
        Tip.build(row.label, [{ color: col, label: fmtPct(frac * 100, 1) + ' of total', value: fmt(row.value), mark: 'rect' }]);
        const bb = seg.getBoundingClientRect();
        Tip.show(ev && ev.clientX ? ev.clientX : bb.x + bb.width / 2, ev && ev.clientY ? ev.clientY : bb.y);
      };
      const out = () => { seg.style.opacity = '1'; Tip.hide(); };
      seg.addEventListener('pointermove', over);
      seg.addEventListener('pointerleave', out);
      seg.addEventListener('focus', () => over(null));
      seg.addEventListener('blur', out);
      svg.appendChild(seg);
      a0 = a1;
    }
    const c1 = svgEl('text', { x: R, y: R - 2, 'text-anchor': 'middle' }, 'fill:var(--ink);font-size:15px;font-weight:650');
    c1.textContent = o.centerValue != null ? o.centerValue : fmt(total);
    const c2 = svgEl('text', { x: R, y: R + 13, 'text-anchor': 'middle' }, 'fill:var(--muted);font-size:9.5px');
    c2.textContent = o.centerLabel || 'Total';
    svg.appendChild(c1); svg.appendChild(c2);
    mount.appendChild(svg);
  },

  /* sparkline — context gray line, accent end dot */
  spark(mount, values, o){
    o = o || {};
    mount.textContent = '';
    const vals = values.filter(isNum);
    if (vals.length < 2) return;
    const W = o.width || 110, H = o.height || 26, p = 3;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const X = i => p + i * (W - 2 * p) / (values.length - 1);
    const Y = v => hi === lo ? H / 2 : p + (H - 2 * p) - (v - lo) / (hi - lo) * (H - 2 * p);
    let d = '';
    values.forEach((v, i) => { if (isNum(v)) d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' }, 'width:' + W + 'px;height:' + H + 'px');
    svg.appendChild(svgEl('path', { d, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' },
      'stroke:var(--spark);stroke-width:1.8'));
    const li = values.length - 1;
    if (isNum(values[li])){
      svg.appendChild(svgEl('circle', { cx: X(li), cy: Y(values[li]), r: 3 },
        'fill:' + (o.endVar ? cssVar(o.endVar) : cssVar('--accent-strong')) + ';stroke:var(--surface);stroke-width:1.5'));
    }
    mount.appendChild(svg);
  },

  /* legend — mark 'line' | 'rect' */
  legendHTML(series, mark){
    if (!series || series.length < 2) return '';
    return '<div class="legend">' + series.map(s =>
      '<span class="legend-item">' +
      (mark === 'line'
        ? '<span class="legend-line" style="border-top-color:' + (s.rawColor || 'var(' + (s.color || '--s1') + ')') + '"></span>'
        : '<span class="legend-swatch" style="background:' + (s.rawColor || 'var(' + (s.color || '--s1') + ')') + '"></span>') +
      esc(s.name) + '</span>').join('') + '</div>';
  },

  /* chart card with a table-view twin (the no-hover / screen-reader path) */
  card(opts){
    const id = uid('ch');
    const html =
      '<div class="card">' +
        '<div class="card-head">' +
          '<div><div class="card-title">' + esc(opts.title) + '</div>' +
          (opts.sub ? '<div class="card-sub">' + opts.sub + '</div>' : '') + '</div>' +
          '<div class="card-actions">' + (opts.actionsHTML || '') +
          '<button class="icon-btn" data-charttoggle="' + id + '" aria-pressed="false" title="Toggle data table" aria-label="Toggle data table for ' + esc(opts.title) + '">' + icon('table') + '</button></div>' +
        '</div>' +
        '<div class="chart" id="' + id + '"></div>' +
        '<div id="' + id + '_leg"></div>' +
        '<div class="chart-tblwrap" id="' + id + '_tbl" hidden></div>' +
        (opts.note ? '<div class="note mt8">' + opts.note + '</div>' : '') +
      '</div>';
    onAfterRender(() => {
      const el = document.getElementById(id);
      if (!el) return;
      opts.render(el);
      const leg = document.getElementById(id + '_leg');
      if (leg && opts.legend) leg.innerHTML = Chart.legendHTML(opts.legend.series, opts.legend.mark);
      const tw = document.getElementById(id + '_tbl');
      if (tw && opts.table){
        tw.innerHTML = '<table class="tbl"><thead><tr>' +
          opts.table.head.map((h, i) => '<th' + (i > 0 ? ' class="num"' : '') + '>' + esc(h) + '</th>').join('') +
          '</tr></thead><tbody>' +
          opts.table.rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i > 0 ? ' class="num"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>';
      }
    });
    return html;
  }
};

function navigate(route){

function renderNav(){
  const nav = $('#nav');

  for (const r of ROUTES){
    if (r.group !== lastGroup && r.group){

    if (r.group !== lastGroup) lastGroup = r.group;

      (UI.state.route === r.id ? ' aria-current="page"' : '') + '>' + icon(r.icon, 17) + '<span>' + esc(r.label) + '</span></button>';

/* ---- modal system ---- */
let _modalPrevFocus = null;
function modal(o){
  closeModal();
  _modalPrevFocus = document.activeElement;
  const root = $('#modalRoot');
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML =
    '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '">' +
      '<div class="modal-head"><div class="modal-title">' + esc(o.title) + '</div>' +
      '<button class="icon-btn" data-close aria-label="Close dialog">' + icon('x') + '</button></div>' +
      '<div class="modal-body">' + o.body + '</div>' +
      '<div class="modal-foot">' + (o.foot || '') + '</div>' +
    '</div>';
  root.appendChild(wrap);
  const dlg = wrap.firstElementChild;
  wrap.addEventListener('mousedown', ev => { if (ev.target === wrap && !o.blockOverlayClose) closeModal(); });
  dlg.querySelector('[data-close]').addEventListener('click', () => closeModal());
  wrap.addEventListener('keydown', ev => {
    if (ev.key === 'Escape'){ ev.stopPropagation(); closeModal(); }
    if (ev.key === 'Tab'){
      const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', dlg).filter(el => !el.disabled && el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first){ last.focus(); ev.preventDefault(); }
      else if (!ev.shiftKey && document.activeElement === last){ first.focus(); ev.preventDefault(); }
    }
  });
  if (o.onOpen) o.onOpen(dlg);
  const focusable = dlg.querySelector('input:not([type=hidden]), select, textarea') || dlg.querySelector('button:not([data-close])');
  if (focusable) focusable.focus();
  return dlg;
}
function closeModal(){
  const root = $('#modalRoot');
  root.textContent = '';
  if (_modalPrevFocus && _modalPrevFocus.focus){ try { _modalPrevFocus.focus(); } catch (e) {} }
  _modalPrevFocus = null;
}

function confirmDialog(o){
  return new Promise(resolve => {
    const dlg = modal({
      title: o.title || 'Are you sure?',
      body: '<p style="font-size:13.5px">' + o.message + '</p>' + (o.detail ? '<div class="note mt8">' + o.detail + '</div>' : ''),
      foot: '<button class="btn" data-cancel>Cancel</button>' +
            '<button class="btn ' + (o.danger ? 'btn-danger solid' : 'btn-primary') + '" data-ok>' + esc(o.confirmLabel || 'Confirm') + '</button>'
    });
    dlg.querySelector('[data-cancel]').addEventListener('click', () => { closeModal(); resolve(false); });
    dlg.querySelector('[data-ok]').addEventListener('click', () => { closeModal(); resolve(true); });
    dlg.querySelector('[data-ok]').focus();
  });
}

/* ---- toast + undo ---- */
function toast(msg, o){
  o = o || {};
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (o.undo){
    const b = document.createElement('button');
    b.className = 'link-btn';
    b.textContent = 'Undo';
    b.addEventListener('click', () => { el.remove(); o.undo(); });
    el.appendChild(b);
  }
  root.appendChild(el);
  setTimeout(() => { el.remove(); }, o.timeout || (o.undo ? 8000 : 4200));
}

/* generic delete-with-undo over an array collection in DB */
function removeWithUndo(collName, id, label, alsoRestore){
  const coll = DB[collName];
  const idx = coll.findIndex(x => x.id === id);
  if (idx < 0) return;
  const [item] = coll.splice(idx, 1);
  save(); render();
  toast(label + ' deleted', {
    undo(){
      coll.splice(Math.min(idx, coll.length), 0, item);
      if (alsoRestore) alsoRestore(item);
      save(); render();
      toast(label + ' restored');
    }
  });
}

/* ---- form builder ---- */
function fieldHTML(f){
  const id = 'f_' + f.key;
  const req = f.required ? ' <span class="req" aria-hidden="true">*</span>' : '';
  let ctl = '';
  const v = f.value == null ? '' : f.value;
  const dis = f.disabled ? ' disabled' : '';
  if (f.type === 'select'){
    ctl = '<select class="input" id="' + id + '" name="' + f.key + '"' + dis + '>' +
      (f.options || []).map(op => {
        const val = Array.isArray(op) ? op[0] : op, lab = Array.isArray(op) ? op[1] : op;
        return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }).join('') + '</select>';
  } else if (f.type === 'textarea'){
    ctl = '<textarea class="input" id="' + id + '" name="' + f.key + '" rows="' + (f.rows || 2) + '" placeholder="' + esc(f.placeholder || '') + '"' + dis + '>' + esc(v) + '</textarea>';
  } else if (f.type === 'checkbox'){
    return '<label class="check" style="margin-top:20px"><input type="checkbox" id="' + id + '" name="' + f.key + '"' + (f.value ? ' checked' : '') + dis + '> ' + esc(f.label) + (f.hint ? ' <button type="button" class="info-dot" data-tip="' + esc(f.hint) + '" aria-label="More information">i</button>' : '') + '</label>';
  } else {
    const t = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    ctl = '<input class="input" id="' + id + '" name="' + f.key + '" type="' + t + '" value="' + esc(v) + '"' +
      (f.step != null ? ' step="' + f.step + '"' : (t === 'number' ? ' step="any"' : '')) +
      (f.min != null ? ' min="' + f.min + '"' : '') +
      (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + dis + '>';
  }
  return '<div class="field"><label for="' + id + '">' + esc(f.label) + req +
    (f.info ? ' <button type="button" class="info-dot" data-tip="' + esc(f.info) + '" aria-label="Explain ' + esc(f.label) + '">i</button>' : '') +
    '</label>' + ctl +
    '<div class="field-err" data-err="' + f.key + '" hidden></div>' +
    (f.hint ? '<div class="hint">' + f.hint + '</div>' : '') + '</div>';
}
function formHTML(rows){
  return '<div class="form">' + rows.map(row => {
    if (!Array.isArray(row)) return row; // raw html passthrough
    const cell = f => typeof f === 'string' ? f : fieldHTML(f);
    const cls = row.length === 3 ? 'frow f3' : row.length === 2 ? 'frow' : '';
    return cls ? '<div class="' + cls + '">' + row.map(cell).join('') + '</div>' : cell(row[0]);
  }).join('') + '</div>';
}
function readForm(dlg, specs){
  const values = {}, errors = {};
  for (const f of specs){
    const el = dlg.querySelector('[name="' + f.key + '"]');
    if (!el) continue;
    let v;
    if (f.type === 'checkbox') v = el.checked;
    else if (f.type === 'number'){
      v = toNum(el.value, null);
      if (el.value !== '' && v == null) errors[f.key] = 'Enter a number';
      if (v != null && f.min != null && v < f.min) errors[f.key] = 'Must be at least ' + f.min;
      if (v != null && f.max != null && v > f.max) errors[f.key] = 'Must be at most ' + f.max;
    }
    else v = el.value.trim();
    if (f.required && (v === '' || v == null)) errors[f.key] = 'Required';
    values[f.key] = v;
  }
  // show/clear inline errors
  $$('[data-err]', dlg).forEach(e => { e.hidden = true; e.textContent = ''; });
  $$('.input.err', dlg).forEach(e => e.classList.remove('err'));
  let first = null;
  for (const k in errors){
    const err = dlg.querySelector('[data-err="' + k + '"]');
    const inp = dlg.querySelector('[name="' + k + '"]');
    if (err){ err.hidden = false; err.textContent = errors[k]; }
    if (inp){ inp.classList.add('err'); if (!first) first = inp; }
  }
  if (first) first.focus();
  return { values, ok: Object.keys(errors).length === 0 };
}
function flatSpecs(rows){
  const out = [];
  for (const r of rows) if (Array.isArray(r)) out.push(...r.filter(f => f && typeof f === 'object'));
  return out;
}

/* an edit-modal helper: standard Save/Cancel + optional Delete */
function editModal(o){
  const dlg = modal({
    title: o.title, wide: o.wide,
    body: formHTML(o.rows) + (o.extra || ''),
    foot: (o.onDelete ? '<button class="btn btn-danger left" data-del>' + icon('trash', 14) + ' Delete</button>' : '') +
      '<button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" data-save>' + esc(o.saveLabel || 'Save') + '</button>',
    onOpen: o.onOpen
  });
  dlg.querySelector('[data-cancel]').addEventListener('click', () => closeModal());
  dlg.querySelector('[data-save]').addEventListener('click', () => {
    const res = readForm(dlg, flatSpecs(o.rows));
    if (!res.ok) return;
    if (o.validate){
      const msg = o.validate(res.values, dlg);
      if (msg){ toast(msg); return; }
    }
    o.onSave(res.values, dlg);
  });
  const enterHandler = ev => {
    if (ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA' && ev.target.tagName !== 'BUTTON'){
      ev.preventDefault();
      dlg.querySelector('[data-save]').click();
    }
  };
  dlg.addEventListener('keydown', enterHandler);
  if (o.onDelete) dlg.querySelector('[data-del]').addEventListener('click', () => o.onDelete(dlg));
  return dlg;
}

/* ---- export / import ---- */
function exportJSON(){
  download('northstar-backup-' + todayISO() + '.json', JSON.stringify(DB, null, 2), 'application/json');
  toast('Backup exported — store it somewhere safe');
}
function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const raw = JSON.parse(reader.result);
      if (!raw || typeof raw !== 'object' || !raw.settings || !Array.isArray(raw.accounts)){
        toast('That file does not look like a Northstar backup.');
        return;
      }
      const ok = await confirmDialog({
        title: 'Import backup?',
        message: 'This replaces <strong>everything</strong> currently in the app with the contents of the backup file.',
        detail: 'Backup created: ' + esc((raw.meta && raw.meta.updatedAt) || 'unknown') + ' · ' + (raw.accounts || []).length + ' accounts · ' + (raw.transactions || []).length + ' transactions',
        confirmLabel: 'Replace my data', danger: true
      });
      if (!ok) return;
      DB = migrate(raw);
      DB.meta.onboarded = true;
      save(); applyTheme(); render();
      toast('Backup imported');
    } catch (e) {
      toast('Could not read that file: ' + (e.message || 'invalid JSON'));
    }
  };
  reader.readAsText(file);
}
function exportTableCSV(filename, head, rows){
  download(filename, csvSerialize([head].concat(rows)), 'text/csv;charset=utf-8');
  toast('CSV exported');
}

        '<span class="evt-amt num ' + (isIn ? 'pos' : '') + '">' + (isIn ? '+' : isTr ? '' : '−') + fmtMoney(u.amtBase) + '</span></div>';
    }).join('') : emptyState('calendar', 'No scheduled items in the next 30 days.')) + '</div>';

  const topGoals = sortBy(DB.goals, g => ({ high: 0, medium: 1, low: 2 }[g.priority] ?? 3)).slice(0, 3);

    '<button class="link-btn" data-action="nav" data-route="goals">All goals →</button></div>' +

        '<span class="small muted num">' + fmtMoney(m.current, null, { compact: true }) + ' / ' + fmtMoney(m.target, null, { compact: true }) + '</span></div>' +
        '<div class="meter ' + lvl + '"><div class="meter-track"><div class="meter-fill" style="width:' + m.pct.toFixed(1) + '%"></div></div>' +

    }).join('') : emptyState('goals', 'No goals yet.')) + '</div>';
  html += '</div></div>';

  /* household split */
  if (lens === 'all' && (S.partnerName || DB.transactions.some(t => t.owner === 'partner'))){
    const hc = Calc.householdContrib(lastFull);
    if (hc.total > 0){
      const myShare = hc.total > 0 ? (hc.paid.me + hc.paid.joint * S.householdSplit / 100) / hc.total * 100 : 0;
      const agreed = toNum(S.householdSplit, 50);
      html += '<div class="card mb12"><div class="card-head"><div><div class="card-title">Joint costs — ' + monthLabel(lastFull) + '</div>' +
        '<div class="card-sub">Who funded shared expenses (joint-account spending assumed split ' + agreed + '/' + (100 - agreed) + ')</div></div></div>' +
        '<div class="row" style="gap:20px">' +
        ['me', 'partner', 'joint'].map(o => '<div><div class="kpi-label"><span class="owner-dot" style="background:var(' + OWNER_VAR[o] + ')"></span> Paid from ' + esc(ownerLabel(o)) + (o === 'joint' ? ' accounts' : '’s accounts') + '</div><div class="b num" style="font-size:17px">' + fmtMoney(hc.paid[o] || 0) + '</div></div>').join('') +
        '<div><div class="kpi-label">' + esc(ownerLabel('me')) + '’s effective share</div><div class="b num" style="font-size:17px">' + fmtPct(myShare, 0) + '</div>' +
        '<div class="x-small muted">agreed ' + fmtPct(agreed, 0) + '</div></div>' +
        '</div><div class="note mt8">A planning view of balance, not a scoreboard — adjust the agreed split in Settings.</div></div>';
    }
  }
  return html;
};

function accountModal(id){
  const a = id ? Calc.account(id) : null;
  const typeOpts = Object.entries(ACCOUNT_TYPES).map(([k, v]) => [k, v.label + (v.kind === 'liability' ? '  (liability)' : '')]);
  const rows = [
    [{ key: 'name', label: 'Account name', required: true, value: a ? a.name : '' },
     { key: 'institution', label: 'Institution', value: a ? a.institution : '' }],
    [{ key: 'type', label: 'Type', type: 'select', options: typeOpts, value: a ? a.type : 'checking' },
     { key: 'owner', label: 'Owner', type: 'select', options: selOwners(), value: a ? a.owner : DB.settings.defaultOwner }],
    [{ key: 'currency', label: 'Currency', type: 'select', options: selCurrencies(), value: a ? a.currency : DB.settings.baseCurrency },
     { key: 'country', label: 'Country', value: a ? a.country : '' },
     { key: 'balance', label: 'Current balance', type: 'number', required: true, value: a ? a.balance : '', info: 'For liabilities, enter the amount owed as a positive number.' }],
    [{ key: 'rate', label: 'Interest / expected return %', type: 'number', value: a && a.rate != null ? a.rate : '', hint: 'APR for debts, APY or expected return for assets.' },
     { key: 'limit', label: 'Credit limit', type: 'number', value: a && a.limit != null ? a.limit : '' },
     { key: 'contribution', label: 'Monthly contribution / payment', type: 'number', value: a && a.contribution != null ? a.contribution : '' }],
    [{ key: 'notes', label: 'Notes', type: 'textarea', value: a ? a.notes : '' }]
  ];
  editModal({
    title: a ? 'Edit account' : 'Add account', rows, wide: true,
    onDelete: a ? () => { closeModal(); deleteAccount(a.id); } : null,
    onSave(v){
      if (a){
        const balChanged = Math.abs((a.balance || 0) - v.balance) > 0.004;
        Object.assign(a, v);
        if (balChanged){
          a.updatedAt = todayISO();
          DB.balances.push({ id: uid('bal'), accountId: a.id, date: todayISO(), balance: v.balance });
        }
        toast('Account updated');
      } else {
        const acc = Object.assign({ id: uid('acc'), archived: false, toAccountId: null, updatedAt: todayISO(), notes: '' }, v);
        DB.accounts.push(acc);
        DB.balances.push({ id: uid('bal'), accountId: acc.id, date: todayISO(), balance: v.balance });
        toast('Account added');
      }
      save(); closeModal(); render();
    }
  });
}

function deleteAccount(id){
  const a = Calc.account(id);
  if (!a) return;
  const txN = DB.transactions.filter(t => t.accountId === id || t.toAccountId === id).length;
  confirmDialog({
    title: 'Delete “' + a.name + '”?',
    message: 'This removes the account and its balance history.' + (txN ? ' <strong>' + txN + ' transaction' + (txN > 1 ? 's' : '') + '</strong> reference it and will keep working, but lose the account link.' : ''),
    detail: 'Archiving keeps history without counting the account in totals — often the better choice.',
    confirmLabel: 'Delete account', danger: true
  }).then(ok => {
    if (!ok) return;
    const hist = DB.balances.filter(b => b.accountId === id);
    DB.balances = DB.balances.filter(b => b.accountId !== id);
    removeWithUndo('accounts', id, 'Account', () => { DB.balances.push(...hist); });
  });
}

function balanceModal(id){
  const a = Calc.account(id);
  if (!a) return;
  const hist = sortBy(DB.balances.filter(b => b.accountId === id), b => b.date, true).slice(0, 14);
  const rows = [
    [{ key: 'balance', label: 'New balance (' + a.currency + ')', type: 'number', required: true, value: a.balance },
     { key: 'date', label: 'As of date', type: 'date', required: true, value: todayISO() }]
  ];
  const sparkId = uid('sp');
  editModal({
    title: 'Update balance — ' + a.name, rows, saveLabel: 'Save balance',
    extra: '<div class="mt12"><div class="card-sub mb8">Balance history (feeds the net-worth trend)</div>' +
      '<div id="' + sparkId + '"></div>' +
      '<div class="tbl-wrap mt8"><table class="tbl"><thead><tr><th>Date</th><th class="num">Balance</th><th></th></tr></thead><tbody>' +
      (hist.length ? hist.map(b => '<tr><td>' + fmtDate(b.date) + '</td><td class="num">' + fmtMoney(b.balance, a.currency) + '</td>' +
        '<td><div class="row-actions"><button class="icon-btn" data-action="bal.del" data-id="' + b.id + '" data-acc="' + a.id + '" aria-label="Delete entry">' + icon('trash', 13) + '</button></div></td></tr>').join('')
        : '<tr><td colspan="3" class="muted">No history yet.</td></tr>') +
      '</tbody></table></div></div>',
    onOpen(){
      const el = document.getElementById(sparkId);
      const chron = sortBy(DB.balances.filter(b => b.accountId === id), b => b.date);
      if (el && chron.length > 1) Chart.spark(el, chron.map(b => b.balance), { width: 240, height: 34 });
    },
    onSave(v){
      const existing = DB.balances.find(b => b.accountId === id && b.date === v.date);
      if (existing) existing.balance = v.balance;
      else DB.balances.push({ id: uid('bal'), accountId: id, date: v.date, balance: v.balance });
      const latest = sortBy(DB.balances.filter(b => b.accountId === id), b => b.date, true)[0];
      if (latest && latest.date === v.date){ a.balance = v.balance; a.updatedAt = v.date; }
      save(); closeModal(); render();
      toast('Balance updated');
    }
  });
}

/* ========================= TRANSACTIONS ========================= */
function filteredTx(){
  const f = UI.state.tx;
  let list = DB.transactions.slice();
  if (UI.state.lens !== 'all') list = list.filter(t => t.owner === UI.state.lens);
  if (f.q){
    const q = f.q.toLowerCase();
    list = list.filter(t => (t.desc || '').toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q) ||
      (t.tags || []).some(tg => tg.toLowerCase().includes(q)) || Calc.catName(t.categoryId).toLowerCase().includes(q));
  }
  if (f.account !== 'all') list = list.filter(t => t.accountId === f.account || t.toAccountId === f.account);
  if (f.category !== 'all') list = list.filter(t => t.categoryId === f.category || (t.splits || []).some(s => s.categoryId === f.category));
  if (f.type !== 'all') list = list.filter(t => t.type === f.type);
  if (f.owner !== 'all') list = list.filter(t => t.owner === f.owner);
  if (f.from) list = list.filter(t => t.date >= f.from);
  if (f.to) list = list.filter(t => t.date <= f.to);
  if (f.flag === 'recurring') list = list.filter(t => t.recurring);
  if (f.flag === 'reimb') list = list.filter(t => t.reimb);
  if (f.flag === 'tax') list = list.filter(t => t.tax);
  if (f.flag === 'split') list = list.filter(t => t.splits && t.splits.length);
  const dir = f.dir === 'asc' ? 1 : -1;
  const key = {
    date: t => t.date, amount: t => Calc.txBase(t) * (TX_TYPES[t.type].flow || 1),
    desc: t => (t.desc || '').toLowerCase(), category: t => Calc.catName(t.categoryId).toLowerCase(), type: t => t.type
  }[f.sort] || (t => t.date);
  list.sort((x, y) => { const a = key(x), b = key(y); return a < b ? -dir : a > b ? dir : 0; });
  return list;
}

          '<td><div class="cell-main">' + esc(t.desc) + ' ' + flags + '</div>' +
          '<div class="cell-sub">' + esc(Calc.accName(t.accountId)) + (isTr && t.toAccountId ? ' → ' + esc(Calc.accName(t.toAccountId)) : '') +
          ((t.tags || []).length ? ' · ' + t.tags.map(esc).join(', ') : '') + '</div></td>' +
          '<td>' + esc(catLabel) + '</td>' +
          '<td>' + typePill(t) + '</td>' +
          '<td>' + ownerBadge(t.owner) + '</td>' +
          '<td class="num b ' + (flow > 0 ? 'pos' : '') + '">' +
            (isTr ? '<span class="muted">⇄ ' + fmtMoney(amt) + '</span>' : (flow > 0 ? '+' : '−') + fmtMoney(amt)) +
            (t.currency !== DB.settings.baseCurrency ? '<div class="cell-sub">' + fmtMoney(t.amount, t.currency) + '</div>' : '') + '</td>' +
          '<td><div class="row-actions">' +
          '<button class="icon-btn" data-action="tx.edit" data-id="' + t.id + '" title="Edit" aria-label="Edit transaction">' + icon('edit', 14) + '</button>' +
          '<button class="icon-btn" data-action="tx.del" data-id="' + t.id + '" title="Delete" aria-label="Delete transaction">' + icon('trash', 14) + '</button>' +
          '</div></td></tr>';
      }).join('') + '</tbody></table></div>';
    html += '<div class="tbl-foot"><span>' + list.length + ' transaction' + (list.length === 1 ? '' : 's') +
      ' · net flow <span class="num ' + signClass(shownTotal) + '">' + fmtMoney(shownTotal, null, { sign: true }) + '</span> <button type="button" class="info-dot" data-tip="Sum of income minus outgoings for the filtered rows. Transfers count as zero.">i</button></span>' +
      (pages > 1 ? '<span class="row" style="gap:4px"><button class="icon-btn" data-action="tx.page" data-d="-1" aria-label="Previous page"' + (f.page === 0 ? ' disabled' : '') + '>' + icon('chevl', 14) + '</button>' +
      '<span class="small">Page ' + (f.page + 1) + ' / ' + pages + '</span>' +
      '<button class="icon-btn" data-action="tx.page" data-d="1" aria-label="Next page"' + (f.page >= pages - 1 ? ' disabled' : '') + '>' + icon('chevr', 14) + '</button></span>' : '') +
      '</div>';
  }
  html += '</div>';

  onAfterRender(() => {
    const inp = document.getElementById('txSearch');
    if (!inp) return;
    let t = null;
    inp.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => {
        UI.state.tx.q = inp.value; UI.state.tx.page = 0;
        const scroll = window.scrollY;
        render();
        window.scrollTo(0, scroll);
        const again = document.getElementById('txSearch');
        if (again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      }, 260);
    });
  });
  return html;
};

function txModal(id, presets){
  const t = id ? DB.transactions.find(x => x.id === id) : null;
  const isNew = !t;
  const val = k => t ? t[k] : (presets && presets[k] != null ? presets[k] : '');
  const rows = [
    [{ key: 'type', label: 'Type', type: 'select', options: Object.entries(TX_TYPES).map(([k, v]) => [k, v.label]), value: t ? t.type : (presets && presets.type) || 'expense',
       info: 'Transfers move money between your accounts and never count as income or spending. Refunds reduce spending. Investment contributions and debt repayments are tracked separately from everyday spending.' },
     { key: 'date', label: 'Date', type: 'date', required: true, value: t ? t.date : todayISO() }],
    [{ key: 'desc', label: 'Description', required: true, value: val('desc'), placeholder: 'e.g. Groceries — Whole Foods' }],
    [{ key: 'amount', label: 'Amount', type: 'number', required: true, min: 0, value: t ? t.amount : '', hint: 'Always positive — the type decides the direction.' },
     { key: 'currency', label: 'Currency', type: 'select', options: selCurrencies(), value: t ? t.currency : DB.settings.baseCurrency }],
    [{ key: 'accountId', label: 'Account', type: 'select', options: selAccounts(), value: t ? t.accountId : (DB.accounts.find(a => !a.archived) || {}).id },
     { key: 'toAccountId', label: 'To account (transfers)', type: 'select', options: [['', '—']].concat(selAccounts()), value: t ? (t.toAccountId || '') : '' }],
    [{ key: 'categoryId', label: 'Category', type: 'select', options: [['', '—']].concat(selCategories()), value: t ? (t.categoryId || '') : (presets && presets.categoryId) || '' },
     { key: 'owner', label: 'Owner', type: 'select', options: selOwners(), value: t ? t.owner : DB.settings.defaultOwner }],
    [{ key: 'tags', label: 'Tags', value: t ? (t.tags || []).join(', ') : '', placeholder: 'comma, separated' },
     { key: 'notes', label: 'Notes', value: val('notes') }],
    '<div class="row" style="gap:16px">' +
      '<label class="check"><input type="checkbox" name="recurring"' + (t && t.recurring ? ' checked' : '') + '> Recurring</label>' +
      '<label class="check"><input type="checkbox" name="reimb"' + (t && t.reimb ? ' checked' : '') + '> Reimbursable</label>' +
      '<label class="check"><input type="checkbox" name="tax"' + (t && t.tax ? ' checked' : '') + '> Tax-related</label>' +
      '<label class="check"><input type="checkbox" name="useSplits"' + (t && t.splits && t.splits.length ? ' checked' : '') + '> Split across categories</label>' +
    '</div>',
    '<div id="splitsBox" class="mt4" hidden></div>'
  ];
  const dlg = editModal({
    title: isNew ? 'Add transaction' : 'Edit transaction', rows, wide: true,
    onDelete: t ? () => { closeModal(); removeWithUndo('transactions', t.id, 'Transaction'); } : null,
    onOpen(dl){
      const box = dl.querySelector('#splitsBox');
      const chk = dl.querySelector('[name=useSplits]');
      const typeSel = dl.querySelector('[name=type]');
      const toWrap = dl.querySelector('[name=toAccountId]').closest('.field');
      const catWrap = dl.querySelector('[name=categoryId]').closest('.field');
      const splits = (t && t.splits ? deepClone(t.splits) : []);
      const renderSplits = () => {
        box.hidden = !chk.checked;
        if (!chk.checked) return;
        if (!splits.length) splits.push({ categoryId: 'other', amount: toNum(dl.querySelector('[name=amount]').value, 0) });
        box.innerHTML = '<div class="card-sub mb8">Split lines must add up to the amount.</div>' +
          splits.map((s, i) =>
            '<div class="row mb8" data-split="' + i + '">' +
            '<select class="input" data-sk="cat" style="flex:2">' + selCategories('expense').map(([v, l]) => '<option value="' + v + '"' + (s.categoryId === v ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>' +
            '<input class="input" data-sk="amt" type="number" step="any" min="0" value="' + s.amount + '" style="flex:1" aria-label="Split amount">' +
            '<button type="button" class="icon-btn" data-sk="del" aria-label="Remove split line">' + icon('x', 14) + '</button></div>').join('') +
          '<button type="button" class="btn btn-sm" data-sk="add">' + icon('plus', 13) + ' Add line</button>' +
          '<span class="small muted" style="margin-left:10px" data-sk="sum"></span>';
        const updSum = () => {
          const tot = sum($$('[data-split] [data-sk=amt]', box), inp => toNum(inp.value, 0));
          const amt = toNum(dl.querySelector('[name=amount]').value, 0);
          const sEl = box.querySelector('[data-sk=sum]');
          sEl.textContent = 'Lines: ' + fmtMoney(tot) + ' / ' + fmtMoney(amt);
          sEl.style.color = Math.abs(tot - amt) < 0.01 ? 'var(--st-good-text)' : 'var(--st-crit-text)';
        };
        $$('[data-split]', box).forEach((rowEl, i) => {
          rowEl.querySelector('[data-sk=cat]').addEventListener('change', e => { splits[i].categoryId = e.target.value; });
          rowEl.querySelector('[data-sk=amt]').addEventListener('input', e => { splits[i].amount = toNum(e.target.value, 0); updSum(); });
          rowEl.querySelector('[data-sk=del]').addEventListener('click', () => { splits.splice(i, 1); renderSplits(); });
        });
        box.querySelector('[data-sk=add]').addEventListener('click', () => { splits.push({ categoryId: 'other', amount: 0 }); renderSplits(); });
        updSum();
      };
      dl._getSplits = () => chk.checked ? splits.filter(s => s.amount > 0) : null;
      chk.addEventListener('change', renderSplits);
      const syncType = () => {
        const ty = typeSel.value;
        toWrap.style.display = ty === 'transfer' ? '' : 'none';
        catWrap.style.display = ty === 'transfer' ? 'none' : '';
        chk.closest('label').style.display = (ty === 'expense' || ty === 'refund') ? '' : 'none';
        if (ty !== 'expense' && ty !== 'refund'){ chk.checked = false; renderSplits(); }
      };
      typeSel.addEventListener('change', syncType);
      syncType(); renderSplits();
    },
    validate(v, dl){
      if (v.type === 'transfer' && !v.toAccountId) return 'Transfers need a destination account.';
      if (v.type === 'transfer' && v.toAccountId === v.accountId) return 'A transfer needs two different accounts.';
      const sp = dl._getSplits && dl._getSplits();
      if (sp && Math.abs(sum(sp, s => s.amount) - v.amount) > 0.01) return 'Split lines must add up to the amount.';
      return null;
    },
    onSave(v, dl){
      const sp = dl._getSplits && dl._getSplits();
      const rec = {
        date: v.date, desc: v.desc, amount: v.amount, currency: v.currency, type: v.type,
        accountId: v.accountId, toAccountId: v.type === 'transfer' ? v.toAccountId : null,
        categoryId: v.type === 'transfer' ? null : (v.categoryId || null),
        splits: sp && sp.length > 1 ? sp : null,
        owner: v.owner, notes: v.notes,
        tags: v.tags ? v.tags.split(',').map(s => s.trim()).filter(Boolean) : [],
        recurring: dl.querySelector('[name=recurring]').checked,
        reimb: dl.querySelector('[name=reimb]').checked,
        tax: dl.querySelector('[name=tax]').checked
      };
      if (t) Object.assign(t, rec);
      else DB.transactions.push(Object.assign({ id: uid('tx') }, rec));
      DB.transactions.sort((a, b) => a.date < b.date ? 1 : -1);
      save(); closeModal(); render();
      toast(t ? 'Transaction updated' : 'Transaction added');
    }
  });
}

/* CSV import wizard */
function txImportModal(){
  let parsed = null, headers = [], fileName = '';
  const body =
    '<div class="form">' +
    '<div class="field"><label for="csvFile">CSV file from your bank</label>' +
    '<input class="input" type="file" id="csvFile" accept=".csv,text/csv"></div>' +
    '<div id="csvMap" hidden></div>' +
    '<div id="csvPrev" hidden></div>' +
    '</div>';
  const dlg = modal({
    title: 'Import transactions from CSV', wide: true, body,
    foot: '<button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" data-import disabled>Import</button>'
  });
  dlg.querySelector('[data-cancel]').addEventListener('click', closeModal);
  const mapBox = dlg.querySelector('#csvMap');
  const prevBox = dlg.querySelector('#csvPrev');
  const importBtn = dlg.querySelector('[data-import]');

  const colSel = (key, label, required) =>
    '<div class="field"><label>' + label + (required ? ' <span class="req">*</span>' : '') + '</label>' +
    '<select class="input" data-map="' + key + '"><option value="-1">—</option>' +
    headers.map((h, i) => '<option value="' + i + '">' + esc(h || ('Column ' + (i + 1))) + '</option>').join('') + '</select></div>';

  function guess(names){
    const idx = headers.findIndex(h => names.some(n => (h || '').toLowerCase().includes(n)));
    return idx;
  }
  function renderMap(){
    mapBox.hidden = false;
    mapBox.innerHTML =
      '<hr class="divider"><div class="card-sub mb8">Map the columns from “' + esc(fileName) + '” (' + parsed.length + ' rows)</div>' +
      '<div class="frow f3">' + colSel('date', 'Date column', true) + colSel('desc', 'Description column', true) + colSel('amount', 'Amount column', true) + '</div>' +
      '<div class="frow f3 mt8">' + colSel('category', 'Category column') +
      '<div class="field"><label>Amount convention</label><select class="input" data-map="sign">' +
      '<option value="negexp">Negative = expense (most banks)</option><option value="posexp">Positive = expense</option></select></div>' +
      '<div class="field"><label>Date format</label><select class="input" data-map="datefmt">' +
      '<option value="auto">Auto-detect</option><option value="MDY">MM/DD/YYYY</option><option value="DMY">DD/MM/YYYY</option><option value="ISO">YYYY-MM-DD</option></select></div></div>' +
      '<div class="frow mt8"><div class="field"><label>Import into account <span class="req">*</span></label>' +
      '<select class="input" data-map="account">' + selAccounts().map(([v, l]) => '<option value="' + v + '">' + esc(l) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Owner</label><select class="input" data-map="owner">' + selOwners().map(([v, l]) => '<option value="' + v + '"' + (v === DB.settings.defaultOwner ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></div></div>';
    const g = { date: guess(['date']), desc: guess(['desc', 'narrat', 'detail', 'payee', 'merchant', 'reference']), amount: guess(['amount', 'value']), category: guess(['categ']) };
    for (const k in g){ if (g[k] >= 0) mapBox.querySelector('[data-map=' + k + ']').value = String(g[k]); }
    mapBox.addEventListener('change', renderPreview);
    renderPreview();
  }
  function parseDateCell(s, fmt){
    s = String(s || '').trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
    if (m) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
    m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s);
    if (m){
      let a = +m[1], b = +m[2], y = +m[3];
      if (y < 100) y += 2000;
      let mm, dd;
      if (fmt === 'DMY'){ dd = a; mm = b; }
      else if (fmt === 'MDY'){ mm = a; dd = b; }
      else { if (a > 12){ dd = a; mm = b; } else { mm = a; dd = b; } }
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return y + '-' + pad2(mm) + '-' + pad2(dd);
    }
    return null;
  }
  function currentMapping(){
    const gv = k => { const el = mapBox.querySelector('[data-map=' + k + ']'); return el ? el.value : '-1'; };
    return { date: +gv('date'), desc: +gv('desc'), amount: +gv('amount'), category: +gv('category'),
      sign: gv('sign'), datefmt: gv('datefmt'), account: gv('account'), owner: gv('owner') };
  }
  function buildRows(){
    const mp = currentMapping();
    if (mp.date < 0 || mp.desc < 0 || mp.amount < 0) return { rows: [], mp, ready: false };
    const acc = Calc.account(mp.account);
    const out = [], bad = [];
    for (const r of parsed){
      const dateISO = parseDateCell(r[mp.date], mp.datefmt);
      const amtRaw = toNum(String(r[mp.amount]).replace(/[()$£€]/g, s => s === '(' ? '-' : ''), null);
      if (!dateISO || amtRaw == null || !String(r[mp.desc] || '').trim()){ bad.push(r); continue; }
      const isExpense = mp.sign === 'negexp' ? amtRaw < 0 : amtRaw > 0;
      let catId = null;
      if (mp.category >= 0){
        const cname = String(r[mp.category] || '').trim().toLowerCase();
        const c = DB.categories.find(cc => cc.name.toLowerCase() === cname || cc.id === cname);
        if (c) catId = c.id;
      }
      if (!catId) catId = isExpense ? 'other' : 'other_income';
      out.push({
        id: uid('tx'), date: dateISO, desc: String(r[mp.desc]).trim(), amount: Math.abs(amtRaw),
        currency: acc ? acc.currency : DB.settings.baseCurrency,
        type: isExpense ? 'expense' : 'income', accountId: mp.account, toAccountId: null,
        categoryId: catId, splits: null, owner: mp.owner, tags: ['imported'], recurring: false, reimb: false, tax: false, notes: ''
      });
    }
    return { rows: out, bad, mp, ready: out.length > 0 };
  }
  function renderPreview(){
    const res = buildRows();
    prevBox.hidden = false;
    importBtn.disabled = !res.ready;
    if (!res.ready){
      prevBox.innerHTML = '<div class="note mt8">Map the date, description and amount columns to continue.</div>';
      return;
    }
    prevBox.innerHTML = '<hr class="divider"><div class="card-sub mb8">Preview — ' + res.rows.length + ' rows will import' +
      (res.bad.length ? ', ' + res.bad.length + ' skipped (unreadable date/amount)' : '') + '</div>' +
      '<div class="csv-preview"><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>' +
      res.rows.slice(0, 6).map(r => '<tr><td>' + r.date + '</td><td>' + esc(r.desc) + '</td><td>' + r.type + '</td><td>' + esc(Calc.catName(r.categoryId)) + '</td><td style="text-align:right">' + fmtMoney(r.amount, r.currency) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }
  dlg.querySelector('#csvFile').addEventListener('change', ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    fileName = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      const all = csvParse(reader.result);
      if (all.length < 2){ toast('That CSV appears to be empty.'); return; }
      headers = all[0].map(h => String(h).trim());
      parsed = all.slice(1);
      renderMap();
    };
    reader.readAsText(file);
  });
  importBtn.addEventListener('click', () => {
    const res = buildRows();
    if (!res.ready) return;
    DB.transactions.push(...res.rows);
    DB.transactions.sort((a, b) => a.date < b.date ? 1 : -1);
    save(); closeModal(); render();
    toast('Imported ' + res.rows.length + ' transactions' + (res.bad.length ? ' (' + res.bad.length + ' skipped)' : ''));
  });
}

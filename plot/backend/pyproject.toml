[project]
name = "plot"
version = "0.1.0"
description = "PLOT — private UK land & development sourcing platform (backend, workers, scheduler)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "croniter>=2.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
plot = "plot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plot*"]

[tool.setuptools.package-data]
plot = ["data/*.csv", "data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
